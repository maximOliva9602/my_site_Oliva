<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #080A07; --panel: #12160e;
  --olive: #2E3D22; --olive-light: #7A9156;
  --cream: #F2EDE4; --text: #D4CFC6; --text-dim: #8A8880;
  --line: rgba(122,145,86,0.18); --err: #e0816b;
}
body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--text); min-height: 100vh; padding: 20px 16px 70px; }
.wrap { max-width: 580px; margin: 0 auto; }

header { text-align: center; margin-bottom: 22px; }
header img { width: 52px; height: 52px; object-fit: contain; margin-bottom: 8px; }
header h1 { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 1.4rem; font-weight: 600; }
header p { color: var(--text-dim); font-size: 0.82rem; margin-top: 3px; }

.progress { display: flex; gap: 5px; margin-bottom: 16px; }
.ps { flex: 1; height: 3px; border-radius: 2px; background: rgba(122,145,86,0.15); transition: background .3s; }
.ps.on { background: var(--olive-light); }

.breadcrumb { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; min-height: 20px; font-size: 0.76rem; color: var(--text-dim); }
.bc-item { color: var(--olive-light); cursor: pointer; }
.bc-item:hover { text-decoration: underline; }
.bc-sep { opacity: .4; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
.card-title { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 1rem; font-weight: 500; margin-bottom: 16px; }

/* category grid (крок 2 — конкретні послуги всередині групи) */
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.cat-card { background: rgba(46,61,34,0.18); border: 1px solid var(--line); border-radius: 12px; padding: 13px 12px; cursor: pointer; transition: all .2s; text-align: left; width: 100%; overflow: hidden; position: relative; }
.cat-card:hover { border-color: var(--olive-light); background: rgba(46,61,34,0.30); }
.cat-card-photo { width: 100%; height: 78px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; display: block; }
.cat-icon { font-size: 1.4rem; margin-bottom: 6px; }
.cat-name { font-size: 0.85rem; color: var(--cream); font-weight: 500; line-height: 1.3; }
.cat-from { font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; }

/* group grid (крок 1 — верхньорівневі категорії) */
.grp-list { display: flex; flex-direction: column; gap: 11px; }
.grp-card {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  border: 1px solid rgba(217,185,120,0.22); border-radius: 16px; padding: 16px 14px;
  cursor: pointer; transition: transform .15s, border-color .2s; color: inherit; font-family: inherit;
}
.grp-card:hover { border-color: rgba(217,185,120,0.5); transform: translateY(-1px); }
.grp-1 { background: linear-gradient(135deg, #2b2420, #17130f); }
.grp-2 { background: linear-gradient(135deg, #3c2440, #22132a); }
.grp-3 { background: linear-gradient(135deg, #1f2c42, #121a29); }
.grp-4 { background: linear-gradient(135deg, #4a2f18, #2a1a0d); }
.grp-5 { background: linear-gradient(135deg, #16362f, #0d211c); }
.grp-ico {
  flex-shrink: 0; width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(217,185,120,0.45);
  display: flex; align-items: center; justify-content: center; color: #D9B978;
}
.grp-ico svg { width: 26px; height: 26px; }
.grp-body { flex: 1; min-width: 0; }
.grp-title { font-family: 'Playfair Display', serif; color: #D9B978; font-size: 1.05rem; font-weight: 600; margin-bottom: 3px; }
.grp-sub { font-size: 0.78rem; color: #B9AFA0; line-height: 1.35; }
.grp-arrow { flex-shrink: 0; color: #D9B978; font-size: 1.3rem; opacity: .8; }

/* master grid */
.master-grid { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
.master-card { width: 120px; flex-shrink: 0; }
.master-card { background: rgba(46,61,34,0.18); border: 1px solid var(--line); border-radius: 12px; padding: 13px 10px; cursor: pointer; transition: all .2s; text-align: center; }
.master-card:hover { border-color: var(--olive-light); background: rgba(46,61,34,0.30); }
.master-card.sel { border-color: var(--olive-light); background: rgba(122,145,86,0.14); }
.master-photo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; display: block; border: 2px solid var(--line); }
.master-any-ico { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; background: rgba(46,61,34,0.3); border: 2px solid var(--line); }
.master-name { font-size: 0.88rem; color: var(--cream); font-weight: 500; }
.lv { display: inline-block; margin-top: 5px; font-size: 0.66rem; padding: 3px 8px; border-radius: 20px; }
.lv-top { background: rgba(202,164,90,0.16); color: #caa45a; }
.lv-reg { background: rgba(122,145,86,0.16); color: var(--olive-light); }
.lv-any { background: rgba(138,136,128,0.18); color: var(--text-dim); }

/* duration */
.dur-list { display: flex; flex-direction: column; gap: 8px; }
.dur-opt { display: flex; justify-content: space-between; align-items: center; background: rgba(46,61,34,0.18); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; cursor: pointer; transition: all .2s; }
.dur-opt:hover { border-color: var(--olive-light); background: rgba(46,61,34,0.30); }
.dur-time { color: var(--cream); font-size: 0.93rem; font-weight: 500; }
.dur-price { color: var(--olive-light); font-size: 0.9rem; font-weight: 600; }

/* slots */
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; margin-top: 8px; }
.slot { background: rgba(46,61,34,0.2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 0; color: var(--cream); font-size: 0.87rem; cursor: pointer; text-align: center; transition: all .15s; }
.slot:hover { border-color: var(--olive-light); }
.slot.sel { background: var(--olive-light); color: var(--black); font-weight: 600; border-color: transparent; }

input[type=date], input[type=text], input[type=tel], textarea {
  width: 100%; background: rgba(46,61,34,0.22); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 13px; color: var(--cream); font-size: 0.92rem; font-family: inherit; margin-bottom: 11px;
}
textarea { resize: vertical; min-height: 66px; }
label.fld { display: block; font-size: 0.77rem; color: var(--text-dim); margin-bottom: 5px; }

.summary { background: rgba(122,145,86,0.07); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; font-size: 0.87rem; line-height: 1.95; margin-bottom: 15px; }
.summary b { color: var(--cream); font-weight: 500; }

.row { display: flex; gap: 10px; margin-top: 6px; }
.btn { flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: 0.92rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s; }
.btn-primary { background: var(--olive-light); color: var(--black); }
.btn-primary:hover { background: #8FA864; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: none; border: 1px solid var(--line); color: var(--text-dim); }
.btn-ghost:hover { color: var(--cream); border-color: var(--olive-light); }

.err { color: var(--err); font-size: 0.81rem; margin-top: 6px; min-height: 18px; text-align: center; }
.empty { color: var(--text-dim); font-size: 0.85rem; text-align: center; padding: 20px 0; }
.hide { display: none !important; }

.done { text-align: center; padding: 16px 0 8px; }
.done .ico { font-size: 2.6rem; margin-bottom: 10px; }
.done h2 { color: var(--olive-light); font-family: 'Playfair Display', serif; font-size: 1.3rem; }
.done p { color: var(--text); margin-top: 12px; line-height: 1.8; font-size: 0.9rem; }
a.back-site { display: inline-block; margin-top: 18px; color: var(--olive-light); text-decoration: none; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/img/logo.png" alt="Oliva" />
    <h1>Онлайн-запис</h1>
    <p>Студія масажу Oliva</p>
  </header>

  <div class="progress" id="progress">
    <div class="ps on" data-s="1"></div>
    <div class="ps" data-s="2"></div>
    <div class="ps" data-s="3"></div>
    <div class="ps" data-s="4"></div>
    <div class="ps" data-s="5"></div>
    <div class="ps" data-s="6"></div>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>

  <!-- 1. Категорія послуг -->
  <div class="card" id="step1">
    <div class="card-title">1. Оберіть категорію послуг</div>
    <div class="grp-list" id="groupGrid"></div>
  </div>

  <!-- 2. Конкретна послуга -->
  <div class="card hide" id="step2">
    <div class="card-title">2. Оберіть послугу</div>
    <div class="cat-grid" id="catGrid"><div class="empty">Завантаження…</div></div>
    <div class="row"><button class="btn btn-ghost" data-back="1">← Назад</button></div>
  </div>

  <!-- 3. Майстер -->
  <div class="card hide" id="step3">
    <div class="card-title">3. Оберіть майстра</div>
    <div class="master-grid" id="masterGrid"></div>
    <div class="row"><button class="btn btn-ghost" data-back="2">← Назад</button></div>
  </div>

  <!-- 4. Тривалість -->
  <div class="card hide" id="step4">
    <div class="card-title">4. Тривалість сеансу</div>
    <div class="dur-list" id="durList"></div>
    <div class="row"><button class="btn btn-ghost" data-back="3">← Назад</button></div>
  </div>

  <!-- 5. Дата + час -->
  <div class="card hide" id="step5">
    <div class="card-title">5. Дата та час</div>
    <label class="fld">Дата</label>
    <input type="date" id="dateInput" />
    <div id="slotsWrap"><div class="empty">Оберіть дату</div></div>
    <div class="row" style="margin-top:14px"><button class="btn btn-ghost" data-back="4">← Назад</button></div>
  </div>

  <!-- 6. Дані клієнта -->
  <div class="card hide" id="step6">
    <div class="card-title">6. Ваші дані</div>
    <div class="summary" id="summary"></div>
    <label class="fld">Ім'я</label>
    <input type="text" id="nameInput" placeholder="Ваше ім'я" maxlength="100" />
    <label class="fld">Телефон</label>
    <input type="tel" id="phoneInput" placeholder="+380 __ ___ __ __" maxlength="30" />
    <label class="fld">Коментар (необов'язково)</label>
    <textarea id="commentInput" maxlength="500" placeholder="Побажання…"></textarea>
    <div class="err" id="bookErr"></div>
    <div class="row">
      <button class="btn btn-ghost" data-back="5">← Назад</button>
      <button class="btn btn-primary" id="bookBtn">Підтвердити запис</button>
    </div>
  </div>

  <!-- Готово -->
  <div class="card hide" id="stepDone">
    <div class="done">
      <div class="ico">✅</div>
      <h2>Запис прийнято!</h2>
      <p id="doneText"></p>
      <a class="back-site" href="/">← На головну</a>
    </div>
  </div>
</div>

<script>
(function () {
  var state = { group: null, category: null, master: null, service: null, date: "", start_min: null };
  var allServices = [], allMasters = [];
  var DOW = ["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
  var ICONS = {
    "Загально-оздоровчий масаж": "💆", "Антистресовий масаж": "🌿",
    "Парний масаж": "👫", "Масаж спини": "👐",
    "Масаж шийно-комірцевої зони": "🦴", "Класичний масаж обличчя": "✨",
    "Антивіковий масаж обличчя": "💎", "Лімфодренажний масаж": "💧",
    "Антицелюлітний масаж": "⭐", "Паріння у фітобочці": "🪵",
    'SPA Ритуал "Фіто-оновлення тіла"': "🌸",
    'Тепловий SPA-ритуал "Глибоке прогрівання для двох"': "🔥",
    "Дитячий масаж": "👶", "Масаж в чотири руки": "🤲",
    "Масаж гарячим камінням": "🪨", "Спортивний масаж": "💪",
  };

  /* ---------- Групи (крок 1) ---------- */
  var GRP_ICONS = {
    general: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 13c2-3 4-4 8-4s6 1 8 4"/><path d="M6 13v3a2 2 0 002 2h8a2 2 0 002-2v-3"/><circle cx="12" cy="6" r="2"/></svg>',
    spa2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="6" r="2.2"/><circle cx="16" cy="6" r="2.2"/><path d="M4 20v-3c0-2.2 1.8-4 4-4s4 1.8 4 4v3"/><path d="M12 20v-3c0-2.2 1.8-4 4-4s4 1.8 4 4v3"/></svg>',
    spa1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="5" r="2.3"/><path d="M7 20v-4c0-2.8 2.2-5 5-5s5 2.2 5 5v4"/><path d="M9 10c0 2 1 4 3 4"/></svg>',
    body: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 4c0 2-1.5 3-1.5 5s1.5 2 1.5 4-1.5 2-1.5 4 1.5 3 1.5 3"/><path d="M15 4c0 2 1.5 3 1.5 5s-1.5 2-1.5 4 1.5 2 1.5 4-1.5 3-1.5 3"/></svg>',
    extra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3c0 3-2 3-2 6a2 2 0 004 0c0-3-2-3-2-6z"/><path d="M6 21v-5a6 6 0 0112 0v5"/><path d="M4 21h16"/></svg>',
  };
  var GROUPS = [
    { key: "general", name: "Загальні масажі",        sub: "Оздоровлення та відновлення для тіла і душі" },
    { key: "spa2",    name: "SPA-масажі для двох",     sub: "Парні масажі та SPA для вас і ваших близьких" },
    { key: "spa1",    name: "SPA-масажі для одного",   sub: "Індивідуальний релакс та глибоке розслаблення" },
    { key: "body",    name: "Корекція фігури",         sub: "Моделювання та покращення контурів тіла" },
    { key: "extra",   name: "Додаткові послуги",       sub: "Додатковий догляд для краси та гармонії" },
  ];
  /* Категорія послуги (parseName().cat) → група. Керується тут; якщо власник
     додасть нову послугу з новою назвою, її категорія без пари в цьому
     словнику потрапить у "Додаткові послуги" (див. дефолт у groupOf). */
  var GROUP_MAP = {
    "Загально-оздоровчий масаж": "general", "Антистресовий масаж": "general",
    "Масаж спини": "general", "Масаж шийно-комірцевої зони": "general",
    "Спортивний масаж": "general", "Міофасціальний масаж": "general",
    "Relax масаж": "general", "Медовий масаж": "general",
    "Масаж для вагітних": "general", "Масаж голови": "general",
    "Масаж стоп": "general", "Вісцеральний масаж": "general",
    "Дитячий масаж": "general",

    "Парний масаж": "spa2",
    'Тепловий SPA-ритуал "Глибоке прогрівання для двох"': "spa2",
    "Масаж в чотири руки": "spa2",

    "Паріння у фітобочці": "spa1", 'SPA Ритуал "Фіто-оновлення тіла"': "spa1",
    "Масаж гарячим камінням": "spa1", "Кобідо": "spa1",
    "Гуа-ша обличчя": "spa1", "Букальний масаж": "spa1",
    "Класичний масаж обличчя": "spa1", "Антивіковий масаж обличчя": "spa1",
    "Пластичний масаж обличчя": "spa1", "Скульптуруючий масаж обличчя": "spa1",
    "Лімфодренажний масаж обличчя": "spa1", "Relax масаж обличчя": "spa1",
    "Моделюючий масаж обличчя": "spa1",

    "Антицелюлітний масаж": "body", "Моделюючий масаж": "body",
    "Лімфодренажний масаж": "body", "Вакуумно-баночний масаж": "body",
    "Апаратно-вакуумний масаж": "body",
    "Обгортання Amore Shemen (гаряче)": "body",
    "Обгортання Amore Shemen (холодне)": "body",
    "Обгортання Bruno Vassari Detox": "body",
    "Гаряче обгортання SPA Seaweed": "body",
    "Гаряча експрес-трансформація тіла": "body",
    "Гаряче моделювання тіла": "body", "Холодне моделювання тіла": "body",
    "Сольове обгортання": "body",

    "Кінезіотейпування": "extra",
  };
  function groupOf(cat) { return GROUP_MAP[cat] || "extra"; }

  function $(id) { return document.getElementById(id); }
  function money(kop) { return kop ? Math.round(kop / 100).toLocaleString("uk-UA") + " грн" : ""; }

  /* Кнопки "← Назад" через data-атрибут, не onclick: goStep живе всередині
     цього IIFE, а onclick="" виконується в глобальному просторі й не бачив її. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-back]");
    if (btn) goStep(parseInt(btn.dataset.back, 10));
  });

  function parseName(name) {
    var lm = name.match(/\((Топ Майстер|Майстер)\)/);
    var level = lm ? lm[1] : null;
    var dm = name.match(/(\d+)\s*хв/);
    var dur = dm ? parseInt(dm[1]) : null;
    if (!dur) { var gm = name.match(/(\d+)\s*год/); if (gm) dur = parseInt(gm[1]) * 60; }
    var cat = name
      .replace(/\s*\(Топ Майстер\)/, "").replace(/\s*\(Майстер\)/, "")
      .replace(/\s+\d+\s*хв$/, "").replace(/\s+\d+\s*год.*$/, "").trim();
    return { cat: cat, level: level, dur: dur };
  }

  function goStep(n) {
    ["step1","step2","step3","step4","step5","step6","stepDone"].forEach(function(id) { $(id).classList.add("hide"); });
    $(n === "done" ? "stepDone" : "step" + n).classList.remove("hide");
    // progress
    var num = n === "done" ? 6 : n;
    document.querySelectorAll(".ps").forEach(function(el) {
      el.classList.toggle("on", parseInt(el.dataset.s) <= num);
    });
    // breadcrumb
    var bc = $("breadcrumb"); bc.innerHTML = "";
    var items = [];
    if (state.group)    items.push({ label: (GROUPS.filter(function(g){return g.key===state.group;})[0]||{}).name || "", step: 1 });
    if (state.category) items.push({ label: (ICONS[state.category] || "") + " " + state.category, step: 2 });
    if (state.master)   items.push({ label: state.master.name, step: 3 });
    if (state.service)  items.push({ label: state.service.duration_min + " хв · " + money(state.service.price), step: 4 });
    items.forEach(function(it, i) {
      var sp = document.createElement("span"); sp.className = "bc-item"; sp.textContent = it.label;
      sp.addEventListener("click", function() { goStep(it.step); }); bc.appendChild(sp);
      if (i < items.length - 1) { var s = document.createElement("span"); s.className = "bc-sep"; s.textContent = "›"; bc.appendChild(s); }
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Завантаження
  Promise.all([
    fetch("/api/public/services").then(function(r) { return r.json(); }),
    fetch("/api/public/all-masters").then(function(r) { return r.json(); })
  ]).then(function(rs) {
    allServices = rs[0].ok ? rs[0].services : [];
    allMasters  = rs[1].ok ? rs[1].masters  : [];
    renderGroups();
  }).catch(function() {
    $("groupGrid").innerHTML = '<div class="empty">Помилка завантаження. Оновіть сторінку.</div>';
  });

  // Крок 1: Групи послуг
  function renderGroups() {
    var box = $("groupGrid"); box.innerHTML = "";
    if (!allServices.length) { box.innerHTML = '<div class="empty">Послуги тимчасово недоступні</div>'; return; }
    GROUPS.forEach(function(g, i) {
      var btn = document.createElement("button"); btn.className = "grp-card grp-" + (i + 1);
      btn.innerHTML =
        '<div class="grp-ico">' + (GRP_ICONS[g.key] || "") + '</div>' +
        '<div class="grp-body"><div class="grp-title">' + g.name + '</div><div class="grp-sub">' + g.sub + '</div></div>' +
        '<div class="grp-arrow">›</div>';
      btn.addEventListener("click", function() {
        state.group = g.key; state.category = null; state.master = null; state.service = null; state.start_min = null;
        renderCats(); goStep(2);
      });
      box.appendChild(btn);
    });
  }

  // Крок 2: Конкретні послуги в межах обраної групи
  function renderCats() {
    var box = $("catGrid"); box.innerHTML = "";
    var cats = {};
    allServices.forEach(function(s) {
      var p = parseName(s.name);
      if (groupOf(p.cat) !== state.group) return;
      if (!cats[p.cat]) cats[p.cat] = { min: Infinity, img: null };
      if (s.price < cats[p.cat].min) cats[p.cat].min = s.price;
      if (!cats[p.cat].img && s.image_url) cats[p.cat].img = s.image_url;
    });
    var names = Object.keys(cats);
    if (!names.length) { box.innerHTML = '<div class="empty">У цій категорії поки немає послуг.</div>'; return; }
    names.forEach(function(cat) {
      var btn = document.createElement("button"); btn.className = "cat-card";
      btn.innerHTML =
        (cats[cat].img ? '<img class="cat-card-photo" src="' + cats[cat].img + '" alt="" />' : '<div class="cat-icon">' + (ICONS[cat] || "🌿") + '</div>') +
        '<div class="cat-name">' + cat + '</div>' +
        '<div class="cat-from">від ' + money(cats[cat].min) + '</div>';
      btn.addEventListener("click", function() {
        state.category = cat; state.master = null; state.service = null; state.start_min = null;
        renderMasters(); goStep(3);
      });
      box.appendChild(btn);
    });
  }

  // Крок 3: Майстри
  function renderMasters() {
    var box = $("masterGrid"); box.innerHTML = "";
    var catIds = allServices.filter(function(s) { return parseName(s.name).cat === state.category; }).map(function(s) { return s.id; });
    var eligible = allMasters.filter(function(m) { return m.service_ids.some(function(id) { return catIds.indexOf(id) !== -1; }); });

    eligible.forEach(function(m) {
      var card = document.createElement("div"); card.className = "master-card";
      var isTop = m.level === "Топ Майстер";
      card.innerHTML =
        (m.photo ? '<img class="master-photo" src="' + m.photo + '" alt="' + m.name + '" />' : '<div class="master-any-ico">👤</div>') +
        '<div class="master-name">' + m.name + '</div>' +
        '<span class="lv ' + (isTop ? "lv-top" : "lv-reg") + '">' + (m.level || "Майстер") + '</span>';
      card.addEventListener("click", function() { state.master = m; renderDurations(); goStep(4); });
      box.appendChild(card);
    });

    if (!eligible.length) {
      var note = document.createElement("div"); note.className = "empty"; note.style.gridColumn = "1/-1";
      note.textContent = "Майстрів для цієї категорії не знайдено."; box.appendChild(note);
    }
  }

  // Крок 4: Тривалість
  function renderDurations() {
    var box = $("durList"); box.innerHTML = "";
    var opts;
    if (!state.master) {
      opts = allServices.filter(function(s) { return parseName(s.name).cat === state.category; });
    } else {
      opts = allServices.filter(function(s) { return parseName(s.name).cat === state.category && state.master.service_ids.indexOf(s.id) !== -1; });
    }
    opts.sort(function(a, b) { return a.duration_min - b.duration_min; });
    if (!opts.length) { box.innerHTML = '<div class="empty">Немає доступних варіантів.</div>'; return; }
    opts.forEach(function(s) {
      var d = s.duration_min;
      var label = d >= 60 ? Math.floor(d/60) + " год" + (d%60 ? " " + d%60 + " хв" : "") : d + " хв";
      var row = document.createElement("div"); row.className = "dur-opt";
      row.innerHTML = '<span class="dur-time">' + label + '</span><span class="dur-price">' + money(s.price) + '</span>';
      row.addEventListener("click", function() { state.service = s; goDate(); goStep(5); });
      box.appendChild(row);
    });
  }

  // Крок 5: Дата + слоти
  function goDate() {
    var d = $("dateInput");
    var min = new Date().toISOString().slice(0,10);
    d.min = min; if (!d.value || d.value < min) d.value = min;
    $("slotsWrap").innerHTML = '<div class="empty">Завантаження…</div>';
    loadSlots();
  }
  $("dateInput").addEventListener("change", function() { state.start_min = null; loadSlots(); });

  function loadSlots() {
    state.date = $("dateInput").value;
    if (!state.date || !state.service) return;
    var wrap = $("slotsWrap"); wrap.innerHTML = '<div class="empty">Завантаження…</div>';
    fetch("/api/public/slots?service=" + state.service.id + "&master=" + (state.master ? state.master.id : "any") + "&date=" + state.date)
      .then(function(r) { return r.json(); }).then(function(j) {
        wrap.innerHTML = "";
        if (!j.ok || !j.slots.length) { wrap.innerHTML = '<div class="empty">На цю дату вільних віконець немає. Спробуйте іншу дату.</div>'; return; }
        var grid = document.createElement("div"); grid.className = "slots";
        j.slots.forEach(function(s) {
          var b = document.createElement("div"); b.className = "slot"; b.textContent = s.time;
          b.addEventListener("click", function() {
            grid.querySelectorAll(".slot").forEach(function(x) { x.classList.remove("sel"); });
            b.classList.add("sel"); state.start_min = s.start_min;
            setTimeout(function() { renderSummary(); goStep(6); }, 150);
          });
          grid.appendChild(b);
        });
        wrap.appendChild(grid);
      }).catch(function() { wrap.innerHTML = '<div class="empty">Помилка завантаження.</div>'; });
  }

  // Крок 6: Резюме
  function renderSummary() {
    var dt = new Date(state.date + "T00:00:00");
    var h = Math.floor(state.start_min/60), m = state.start_min%60;
    var time = String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
    var p = parseName(state.service.name);
    $("summary").innerHTML =
      "Послуга: <b>" + p.cat + "</b><br>" +
      "Майстер: <b>" + state.master.name + "</b><br>" +
      "Тривалість: <b>" + state.service.duration_min + " хв</b><br>" +
      "Ціна: <b>" + money(state.service.price) + "</b><br>" +
      "Дата: <b>" + DOW[dt.getDay()] + ", " + state.date.split("-").reverse().slice(0,2).join(".") + "</b><br>" +
      "Час: <b>" + time + "</b>";
  }

  // Бронювання
  $("bookBtn").addEventListener("click", function() {
    var name = $("nameInput").value.trim(), phone = $("phoneInput").value.trim();
    var err = $("bookErr"); err.textContent = "";
    if (!name) { err.textContent = "Вкажіть ім'я"; return; }
    if (phone.replace(/\D/g,"").length < 9) { err.textContent = "Вкажіть коректний телефон"; return; }
    var btn = this; btn.disabled = true; btn.textContent = "Зачекайте…";
    fetch("/api/public/book", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ service: state.service.id, master: state.master.id, date: state.date, start_min: state.start_min, name: name, phone: phone, comment: $("commentInput").value.trim() })
    }).then(function(r) { return r.json().then(function(j) { return { code: r.status, j: j }; }); })
      .then(function(res) {
        btn.disabled = false; btn.textContent = "Підтвердити запис";
        if (res.code === 409) { err.textContent = "Це віконце щойно зайняли. Оберіть інший час."; setTimeout(function() { goStep(5); goDate(); }, 1000); return; }
        if (!res.j.ok) { err.textContent = "Помилка. Спробуйте ще раз."; return; }
        var p = parseName(state.service.name);
        var h = Math.floor(state.start_min/60), m = state.start_min%60;
        $("doneText").innerHTML = "Нагадаємо про візит за 24 години.<br><br><b>" + p.cat + "</b> · " + state.master.name + "<br>" + state.date.split("-").reverse().slice(0,2).join(".") + ", " + String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
        goStep("done");
      }).catch(function() { btn.disabled = false; btn.textContent = "Підтвердити запис"; err.textContent = "Помилка з'єднання."; });
  });
})();
</script>
<script src="assets/js/track.js"></script>
</body>
</html>
