<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --black: #0a0806; --panel: rgba(22,16,10,0.82);
  --olive: #2E3D22; --olive-light: #7A9156;
  --cream: #F2EDE4; --text: #D4CFC6; --text-dim: #8A8880;
  --line: rgba(217,185,120,0.18); --err: #e0816b; --gold: #D9B978;
}

body {
  font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh;
  background: #0a0806 url('assets/img/SPA.jpeg') center/cover fixed;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(160deg, rgba(7,5,3,0.80) 0%, rgba(7,5,3,0.70) 45%, rgba(7,5,3,0.90) 100%);
  pointer-events: none;
}

.wrap { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; padding: 0 0 90px; }
.hide { display: none !important; }

/* ── HERO (step 1) ──────────────────────────────────── */
#step1Hero { text-align: center; padding: 20px 20px 14px; }

.hero-logo {
  width: 60px; height: 60px; object-fit: contain;
  filter: drop-shadow(0 0 20px rgba(217,185,120,0.30));
  margin-bottom: 8px;
}
.hero-brand-name {
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  font-size: 1.65rem; font-weight: 600;
  letter-spacing: .20em;
  line-height: 1;
}
.hero-brand-sub {
  font-size: .60rem; color: rgba(217,185,120,0.72);
  letter-spacing: .24em; text-transform: uppercase;
  margin-top: 4px; margin-bottom: 14px;
}
.hero-h1 {
  font-family: 'Playfair Display', serif;
  color: #fff; font-size: 2.3rem; font-weight: 600;
  line-height: 1.12; margin-bottom: 10px;
}
.hero-ornament { margin: 0 auto 12px; width: 200px; display: block; }
.hero-hint {
  font-size: .76rem; color: rgba(212,207,198,0.52);
  letter-spacing: .04em; margin-bottom: 12px;
}

/* ── GROUP LIST ─────────────────────────────────────── */
.grp-list { display: flex; flex-direction: column; gap: 9px; padding: 0 16px; }

.grp-card {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  background: rgba(18,12,7,0.72);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(217,185,120,0.20);
  border-radius: 16px; padding: 12px 16px;
  cursor: pointer; color: inherit; font-family: inherit;
  transition: transform .15s, border-color .2s, background .2s;
}
.grp-card:active { transform: scale(.99); }
@media (hover: hover) {
  .grp-card:hover { border-color: rgba(217,185,120,0.42); background: rgba(34,22,12,0.82); transform: translateY(-1px); }
}

.grp-ico {
  flex-shrink: 0; width: 56px; height: 56px;
  border-radius: 50%; border: 1.5px solid;
  display: flex; align-items: center; justify-content: center;
}
.grp-ico svg { width: 26px; height: 26px; }

/* Per-category icon color */
.grp-1 .grp-ico { border-color: #D9B978; color: #D9B978; }
.grp-2 .grp-ico { border-color: #E8A0B4; color: #E8A0B4; }
.grp-3 .grp-ico { border-color: #7ECFBD; color: #7ECFBD; }
.grp-4 .grp-ico { border-color: #E0B84A; color: #E0B84A; }
.grp-5 .grp-ico { border-color: #B0A0D8; color: #B0A0D8; }

.grp-body { flex: 1; min-width: 0; }
.grp-title { font-family: 'Playfair Display', serif; color: #fff; font-size: 1.02rem; font-weight: 600; margin-bottom: 3px; }
.grp-sub { font-size: .75rem; color: var(--text-dim); line-height: 1.42; }
.grp-arrow { flex-shrink: 0; color: var(--gold); font-size: 1.4rem; opacity: .75; line-height: 1; }

/* ── TRUST BAR ──────────────────────────────────────── */
#trustBar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: rgba(10,7,4,0.92);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid rgba(217,185,120,0.12);
  display: flex; align-items: center; justify-content: space-around;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
}
.trust-item { display: flex; align-items: center; gap: 7px; flex: 1; justify-content: center; }
.trust-ico { flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: rgba(217,185,120,0.72); }
.trust-ico svg { width: 16px; height: 16px; }
.trust-label { font-size: .60rem; color: rgba(180,175,165,0.75); line-height: 1.35; }
.trust-sep { width: 1px; height: 26px; background: rgba(217,185,120,0.13); flex-shrink: 0; }

/* ── PROGRESS + BREADCRUMB ──────────────────────────── */
.progress { display: flex; gap: 5px; margin: 14px 16px 8px; }
.ps { flex: 1; height: 3px; border-radius: 2px; background: rgba(122,145,86,0.15); transition: background .3s; }
.ps.on { background: var(--olive-light); }
.breadcrumb { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin: 0 16px 12px; min-height: 20px; font-size: .76rem; color: var(--text-dim); }
.bc-item { color: var(--olive-light); cursor: pointer; }
.bc-item:hover { text-decoration: underline; }
.bc-sep { opacity: .4; }

/* ── CARDS (steps 2-6) ──────────────────────────────── */
.card {
  background: rgba(16,20,12,0.84);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 16px; margin: 0 16px 14px;
}
.card-title { font-family: 'Playfair Display', serif; color: var(--cream); font-size: .95rem; font-weight: 500; margin-bottom: 14px; }

/* ── CATEGORY GRID ──────────────────────────────────── */
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.cat-card { background: rgba(46,61,34,0.18); border: 1px solid var(--line); border-radius: 12px; padding: 13px 12px; cursor: pointer; transition: all .2s; text-align: left; width: 100%; overflow: hidden; position: relative; }
.cat-card:hover { border-color: var(--olive-light); background: rgba(46,61,34,0.30); }
.cat-card-photo { width: 100%; height: 78px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; display: block; }
.cat-icon { font-size: 1.4rem; margin-bottom: 6px; }
.cat-name { font-size: .85rem; color: var(--cream); font-weight: 500; line-height: 1.3; }
.cat-from { font-size: .72rem; color: var(--text-dim); margin-top: 4px; }

/* ── MASTERS ────────────────────────────────────────── */
.master-grid { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; }
.master-card { width: 120px; flex-shrink: 0; background: rgba(46,61,34,0.18); border: 1px solid var(--line); border-radius: 12px; padding: 13px 10px; cursor: pointer; transition: all .2s; text-align: center; }
.master-card:hover { border-color: var(--olive-light); background: rgba(46,61,34,0.30); }
.master-card.sel { border-color: var(--olive-light); background: rgba(122,145,86,0.14); }
.master-photo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; }
.master-any-ico { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; background: rgba(46,61,34,0.3); border: 2px solid var(--line); }
.master-name { font-size: .83rem; color: var(--cream); font-weight: 500; margin-bottom: 4px; }
.lv { display: inline-block; font-size: .68rem; padding: 2px 7px; border-radius: 8px; }
.lv-top { background: rgba(202,164,90,0.16); color: #caa45a; }
.lv-reg { background: rgba(122,145,86,0.16); color: var(--olive-light); }
.lv-any { background: rgba(138,136,128,0.18); color: var(--text-dim); }

/* ── DURATIONS ──────────────────────────────────────── */
.dur-list { display: flex; flex-direction: column; gap: 8px; }
.dur-opt { display: flex; justify-content: space-between; align-items: center; background: rgba(46,61,34,0.18); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; cursor: pointer; transition: all .2s; }
.dur-opt:hover { border-color: var(--olive-light); background: rgba(46,61,34,0.30); }
.dur-time { color: var(--cream); font-size: .92rem; font-weight: 500; }
.dur-price { color: var(--olive-light); font-size: .88rem; font-weight: 600; }

/* ── SLOTS ──────────────────────────────────────────── */
.slots { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
.slot { background: rgba(46,61,34,0.2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 0; color: var(--cream); font-size: .87rem; cursor: pointer; text-align: center; transition: all .15s; }
.slot:hover { border-color: var(--olive-light); }
.slot.sel { background: var(--olive-light); color: var(--black); font-weight: 600; border-color: transparent; }

/* ── FORM ───────────────────────────────────────────── */
.fld { display: block; font-size: .75rem; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
input, textarea, select {
  width: 100%; background: rgba(46,61,34,0.22); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 13px; color: var(--cream); font-size: .92rem; font-family: inherit; margin-bottom: 11px;
}
input:focus, textarea:focus { outline: none; border-color: var(--olive-light); }
textarea { resize: none; height: 78px; }
#masterDatePicker { margin-bottom: 14px; }

/* ── MISC ───────────────────────────────────────────── */
.summary { background: rgba(122,145,86,0.07); border: 1px solid var(--line); border-radius: 11px; padding: 13px 15px; font-size: .87rem; line-height: 1.95; margin-bottom: 15px; }
.row { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; border: none; border-radius: 10px; padding: 12px; font-size: .92rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s; }
.btn-primary { background: var(--olive-light); color: var(--black); }
.btn-primary:hover { background: #8FA864; }
.btn-primary:disabled { opacity: .6; }
.btn-ghost { background: none; border: 1px solid var(--line); color: var(--text-dim); }
.err { color: var(--err); font-size: .82rem; min-height: 18px; margin-bottom: 4px; }
.empty { color: var(--text-dim); font-size: .88rem; padding: 16px 0; text-align: center; }
.done { text-align: center; padding: 20px 0; }
.done .ico { font-size: 2.8rem; margin-bottom: 10px; }
.done h2 { color: var(--olive-light); font-family: 'Playfair Display', serif; font-size: 1.3rem; }
.done p { color: var(--text); margin-top: 12px; line-height: 1.8; font-size: .9rem; }
a.back-site { display: inline-block; margin-top: 18px; color: var(--olive-light); text-decoration: none; font-size: .85rem; }
</style>
</head>

    spa2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="7.3" r="2.4"/><circle cx="15.5" cy="7.3" r="2.4"/><path d="M4.5 19.5v-1.9c0-2.2 1.8-4 4-4s4 1.8 4 4v1.9"/><path d="M11.5 19.5v-1.9c0-2.2 1.8-4 4-4s4 1.8 4 4v1.9"/></svg>',
    spa1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c1.4 1.9 1.4 4.7 0 7.1-1.4-2.4-1.4-5.2 0-7.1z"/><path d="M12 12.1c-2.2-.55-4-2.35-4.6-4.75 2.3-.2 4.05.9 4.6 2.65"/><path d="M12 12.1c2.2-.55 4-2.35 4.6-4.75-2.3-.2-4.05.9-4.6 2.65"/><path d="M12 12.6c-2.95.25-5.7-1-7.5-3.05 2.65-1 5.4-.4 7.5 1.45"/><path d="M12 12.6c2.95.25 5.7-1 7.5-3.05-2.65-1-5.4-.4-7.5 1.45"/><path d="M4.2 12.6c2.4 2.2 5.1 3.2 7.8 3.2s5.4-1 7.8-3.2"/></svg>',
    body: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.3" r="1.9"/><path d="M8.9 7.9c.75-.5 1.9-.75 3.1-.75s2.35.25 3.1.75"/><path d="M9 7.9c-.55 1.4-.95 2.6-.45 3.95M15 7.9c.55 1.4.95 2.6.45 3.95"/><path d="M8.55 11.85c1.05.7 1.5 1.75 1.05 3.2M15.45 11.85c-1.05.7-1.5 1.75-1.05 3.2"/><path d="M9.6 15.05c-.3 1.55-.4 3-.15 4.45M14.4 15.05c.3 1.55.4 3 .15 4.45"/><path d="M9.45 19.5h5.1"/><path d="M5.6 12v2M4.6 13h2"/><path d="M18.4 12v2M17.4 13h2"/></svg>',
    extra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.3c.75 3.25 1.75 4.25 5 5-3.25.75-4.25 1.75-5 5-.75-3.25-1.75-4.25-5-5 3.25-.75 4.25-1.75 5-5z"/><path d="M18.2 13.8c.32 1.45.82 1.95 2.3 2.3-1.48.35-1.98.85-2.3 2.3-.32-1.45-.82-1.95-2.3-2.3 1.48-.35 1.98-.85 2.3-2.3z"/><path d="M6.4 15c.22 1 .62 1.4 1.6 1.62-.98.22-1.38.62-1.6 1.6-.22-.98-.62-1.38-1.6-1.6.98-.22 1.38-.62 1.6-1.62z"/></svg>',
  };
  var GROUPS = [
    { key: "general", name: "Масажі",           sub: "Оздоровлення та відновлення для тіла і душі" },
    { key: "spa2",    name: "SPA для двох",      sub: "Парні масажі та SPA для вас і ваших близьких" },
    { key: "spa1",    name: "SPA для одного",    sub: "Індивідуальний релакс та глибоке розслаблення" },
    { key: "body",    name: "Корекція фігури",   sub: "Моделювання та покращення контурів тіла" },
    { key: "extra",   name: "Додаткові послуги", sub: "Додатковий догляд для краси та гармонії" },
  ];
  /* Категорія послуги (parseName().cat) → група. Керується тут; якщо власник
     додасть нову послугу з новою назвою, її категорія без пари в цьому
     словнику потрапить у "Додаткові послуги" (див. дефолт у groupOf). */
  var GROUP_MAP = {
    "Загально-оздоровчий масаж": "general", "Антистресовий масаж": "general",
    "Масаж спини": "general", "Масаж шийно-комірцевої зони": "general",
    "Спортивний масаж": "general", "Міофасціальний масаж": "general",
    "Relax масаж": "general", "Медовий масаж": "general",
    "Масаж для вагітних": "general", "Масаж голови": "general",
    "Масаж стоп": "general", "Вісцеральний масаж": "general",
    "Дитячий масаж": "general",

    "Парний масаж": "spa2",
    'Тепловий SPA-ритуал "Глибоке прогрівання для двох"': "spa2",
    "Масаж в чотири руки": "spa2",

    "Паріння у фітобочці": "spa1", 'SPA Ритуал "Фіто-оновлення тіла"': "spa1",
    "Масаж гарячим камінням": "spa1", "Кобідо": "spa1",
    "Гуа-ша обличчя": "spa1", "Букальний масаж": "spa1",
    "Класичний масаж обличчя": "spa1", "Антивіковий масаж обличчя": "spa1",
    "Пластичний масаж обличчя": "spa1", "Скульптуруючий масаж обличчя": "spa1",
    "Лімфодренажний масаж обличчя": "spa1", "Relax масаж обличчя": "spa1",
    "Моделюючий масаж обличчя": "spa1",

    "Антицелюлітний масаж": "body", "Моделюючий масаж": "body",
    "Лімфодренажний масаж": "body", "Вакуумно-баночний масаж": "body",
    "Апаратно-вакуумний масаж": "body",
    "Обгортання Amore Shemen (гаряче)": "body",
    "Обгортання Amore Shemen (холодне)": "body",
    "Обгортання Bruno Vassari Detox": "body",
    "Гаряче обгортання SPA Seaweed": "body",
    "Гаряча експрес-трансформація тіла": "body",
    "Гаряче моделювання тіла": "body", "Холодне моделювання тіла": "body",
    "Сольове обгортання": "body",

    "Кінезіотейпування": "extra",
  };
  function groupOf(cat) { return GROUP_MAP[cat] || "extra"; }
  /* services.category (редагується в /admin) може перекрити автоматичне
     групування за назвою — досить записати туди одну з 5 назв групи.
     Порожнє/незнайоме значення — як і раніше, групуємо за GROUP_MAP. */
  function resolveGroup(s, parsedCat) {
    var raw = (s.category || "").trim();
    var g = GROUPS.filter(function (x) { return x.name === raw; })[0];
    return g ? g.key : groupOf(parsedCat);
  }

  function $(id) { return document.getElementById(id); }
  function money(kop) { return kop ? Math.round(kop / 100).toLocaleString("uk-UA") + " грн" : ""; }

  /* Телефон: жорстко +380 і рівно 9 цифр після — не більше й не менше.
     Розбираємо на "префікс" + "хвіст цифр", а не на суцільний рядок:
     якщо парсити все наскрізь (включно з уже вставленим +380), перша
     цифра "0" від локального номера ("0667894576") плутається з тим
     самим "380" з префікса й губиться. */
  function isValidPhone(v) { return /^\+380\d{9}$/.test(v); }
  var phoneInput = document.getElementById("phoneInput");
  phoneInput.value = "+380";
  phoneInput.addEventListener("input", function () {
    var v = this.value, suffix;
    if (v.slice(0, 4) === "+380") {
      suffix = v.slice(4);
    } else if ("+380".indexOf(v) === 0) {
      // Стерли (бекспейсом) частину префікса — просто починаємо занову.
      suffix = "";
    } else {
      // Вставили щось довільне (напр. без "+") — розбираємо з нуля.
      var raw = v.replace(/\D/g, "");
      if (raw.indexOf("380") === 0) raw = raw.slice(3);
      suffix = raw;
    }
    suffix = suffix.replace(/\D/g, "");
    /* Хтось, не помітивши вже підставлений префікс, за звичкою додає
       свій власний "380" або "0" на початку хвоста — прибираємо теж. */
    if (suffix.indexOf("380") === 0) suffix = suffix.slice(3);
    else if (suffix.charAt(0) === "0") suffix = suffix.slice(1);
    suffix = suffix.slice(0, 9);
    this.value = "+380" + suffix;
    this.setSelectionRange(this.value.length, this.value.length);
  });
  phoneInput.addEventListener("focus", function () {
    if (!this.value) this.value = "+380";
  });

  /* Кнопки "← Назад" через data-атрибут, не onclick: goStep живе всередині
     цього IIFE, а onclick="" виконується в глобальному просторі й не бачив її. */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-back]");
    if (btn) goStep(parseInt(btn.dataset.back, 10));
  });

  function parseName(name) {
    var lm = name.match(/\((Топ Майстер|Майстер)\)/);
    var level = lm ? lm[1] : null;
    var dm = name.match(/(\d+)\s*хв/);
    var dur = dm ? parseInt(dm[1]) : null;
    if (!dur) { var gm = name.match(/(\d+)\s*год/); if (gm) dur = parseInt(gm[1]) * 60; }
    var cat = name
      .replace(/\s*\(Топ Майстер\)/, "").replace(/\s*\(Майстер\)/, "")
      .replace(/\s+\d+\s*хв$/, "").replace(/\s+\d+\s*год.*$/, "").trim();
    return { cat: cat, level: level, dur: dur };
  }

  function goStep(n) {
    // Показати/сховати hero і прогрес залежно від кроку
    var hero = $("step1Hero"), prog = $("progress");
    if (hero) hero.style.display = (n === 1) ? "" : "none";
    if (prog) prog.style.display = (n === 1) ? "none" : "";

    ["step1","step2","step3","step4","step5","step6","stepDone"].forEach(function(id) { $(id).classList.add("hide"); });
    $(n === "done" ? "stepDone" : "step" + n).classList.remove("hide");
    // progress
    var num = n === "done" ? 6 : n;
    document.querySelectorAll(".ps").forEach(function(el) {
      el.classList.toggle("on", parseInt(el.dataset.s) <= num);
    });
    // breadcrumb
    var bc = $("breadcrumb"); bc.innerHTML = "";
    var items = [];
    if (state.group)    items.push({ label: (GROUPS.filter(function(g){return g.key===state.group;})[0]||{}).name || "", step: 1 });
    if (state.category) items.push({ label: (ICONS[state.category] || "") + " " + state.category, step: 2 });
    if (state.master)   items.push({ label: state.master.name, step: 3 });
    if (state.service)  items.push({ label: state.service.duration_min + " хв · " + money(state.service.price), step: 4 });
    items.forEach(function(it, i) {
      var sp = document.createElement("span"); sp.className = "bc-item"; sp.textContent = it.label;
      sp.addEventListener("click", function() { goStep(it.step); }); bc.appendChild(sp);
      if (i < items.length - 1) { var s = document.createElement("span"); s.className = "bc-sep"; s.textContent = "›"; bc.appendChild(s); }
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Завантаження
  Promise.all([
    fetch("/api/public/services").then(function(r) { return r.json(); }),
    fetch("/api/public/all-masters").then(function(r) { return r.json(); })
  ]).then(function(rs) {
    allServices = rs[0].ok ? rs[0].services : [];
    allMasters  = rs[1].ok ? rs[1].masters  : [];
    renderGroups();
  }).catch(function() {
    $("groupGrid").innerHTML = '<div class="empty">Помилка завантаження. Оновіть сторінку.</div>';
  });

  // Крок 1: Групи послуг
  function renderGroups() {
    var box = $("groupGrid"); box.innerHTML = "";
    if (!allServices.length) { box.innerHTML = '<div class="empty">Послуги тимчасово недоступні</div>'; return; }
    GROUPS.forEach(function(g, i) {
      var btn = document.createElement("button"); btn.className = "grp-card grp-" + (i + 1);
      btn.innerHTML =
        '<div class="grp-ico">' + (GRP_ICONS[g.key] || "") + '</div>' +
        '<div class="grp-body"><div class="grp-title">' + g.name + '</div><div class="grp-sub">' + g.sub + '</div></div>' +
        '<div class="grp-arrow">›</div>';
      btn.addEventListener("click", function() {
        state.group = g.key; state.category = null; state.master = null; state.service = null; state.start_min = null;
        renderCats(); goStep(2);
      });
      box.appendChild(btn);
    });
  }

  // Крок 2: Конкретні послуги в межах обраної групи
  function renderCats() {
    var box = $("catGrid"); box.innerHTML = "";
    var cats = {};
    allServices.forEach(function(s) {
      var p = parseName(s.name);
      if (resolveGroup(s, p.cat) !== state.group) return;
      if (!cats[p.cat]) cats[p.cat] = { min: Infinity, img: null };
      if (s.price < cats[p.cat].min) cats[p.cat].min = s.price;
      if (!cats[p.cat].img && s.image_url) cats[p.cat].img = s.image_url;
    });
    var names = Object.keys(cats);
    if (!names.length) { box.innerHTML = '<div class="empty">У цій категорії поки немає послуг.</div>'; return; }
    names.forEach(function(cat) {
      var btn = document.createElement("button"); btn.className = "cat-card";
      btn.innerHTML =
        (cats[cat].img ? '<img class="cat-card-photo" src="' + cats[cat].img + '" alt="" />' : '<div class="cat-icon">' + (ICONS[cat] || "🌿") + '</div>') +
        '<div class="cat-name">' + cat + '</div>' +
        '<div class="cat-from">від ' + money(cats[cat].min) + '</div>';
      btn.addEventListener("click", function() {
        state.category = cat; state.master = null; state.service = null; state.start_min = null;
        renderMasters(); goStep(3);
      });
      box.appendChild(btn);
    });
  }

  // Крок 3: Майстри (з фільтром по даті)
  function renderMasters() {
    var today = new Date().toISOString().slice(0, 10);
    var dp = $("masterDatePicker");
    dp.min = today;
    if (!state.date || state.date < today) state.date = today;
    dp.value = state.date;
    dp.onchange = function() {
      state.date = dp.value;
      state.master = null; state.service = null; state.start_min = null;
      loadMastersForDate(state.date);
    };
    loadMastersForDate(state.date);
  }

  function loadMastersForDate(date) {
    var box = $("masterGrid");
    box.innerHTML = '<div class="empty">Завантаження…</div>';
    var catIds = allServices.filter(function(s) { return parseName(s.name).cat === state.category; }).map(function(s) { return s.id; });
    fetch("/api/public/available-masters?date=" + encodeURIComponent(date))
      .then(function(r) { return r.json(); })
      .then(function(j) {
        box.innerHTML = "";
        var eligible = (j.masters || []).filter(function(m) {
          return m.service_ids.some(function(id) { return catIds.indexOf(id) !== -1; });
        });
        eligible.forEach(function(m) {
          var card = document.createElement("div"); card.className = "master-card";
          var isTop = m.level === "Топ Майстер";
          card.innerHTML =
            (m.photo ? '<img class="master-photo" src="' + m.photo + '" alt="' + m.name + '" />' : '<div class="master-any-ico">👤</div>') +
            '<div class="master-name">' + m.name + '</div>' +
            '<span class="lv ' + (isTop ? "lv-top" : "lv-reg") + '">' + (m.level || "Майстер") + '</span>';
          card.addEventListener("click", function() { state.master = m; renderDurations(); goStep(4); });
          box.appendChild(card);
        });
        if (!eligible.length) {
          var note = document.createElement("div"); note.className = "empty"; note.style.gridColumn = "1/-1";
          note.textContent = "На цю дату майстри недоступні. Оберіть іншу дату."; box.appendChild(note);
        }
      })
      .catch(function() { $("masterGrid").innerHTML = '<div class="empty">Помилка завантаження.</div>'; });
  }

  // Крок 4: Тривалість
  function renderDurations() {
    var box = $("durList"); box.innerHTML = "";
    var opts;
    if (!state.master) {
      opts = allServices.filter(function(s) { return parseName(s.name).cat === state.category; });
    } else {
      opts = allServices.filter(function(s) { return parseName(s.name).cat === state.category && state.master.service_ids.indexOf(s.id) !== -1; });
    }
    opts.sort(function(a, b) { return a.duration_min - b.duration_min; });
    if (!opts.length) { box.innerHTML = '<div class="empty">Немає доступних варіантів.</div>'; return; }
    opts.forEach(function(s) {
      var d = s.duration_min;
      var label = d >= 60 ? Math.floor(d/60) + " год" + (d%60 ? " " + d%60 + " хв" : "") : d + " хв";
      var row = document.createElement("div"); row.className = "dur-opt";
      row.innerHTML = '<span class="dur-time">' + label + '</span><span class="dur-price">' + money(s.price) + '</span>';
      row.addEventListener("click", function() { state.service = s; goDate(); goStep(5); });
      box.appendChild(row);
    });
  }

  // Крок 5: Дата + слоти
  function goDate() {
    var d = $("dateInput");
    var min = new Date().toISOString().slice(0,10);
    d.min = min;
    // Підставляємо дату, обрану в кроці 3
    if (state.date && state.date >= min) d.value = state.date;
    else if (!d.value || d.value < min) d.value = min;
    $("slotsWrap").innerHTML = '<div class="empty">Завантаження…</div>';
    loadSlots();
  }
  $("dateInput").addEventListener("change", function() { state.date = this.value; state.start_min = null; loadSlots(); });

  function loadSlots() {
    state.date = $("dateInput").value;
    if (!state.date || !state.service) return;
    var wrap = $("slotsWrap"); wrap.innerHTML = '<div class="empty">Завантаження…</div>';
    fetch("/api/public/slots?service=" + state.service.id + "&master=" + (state.master ? state.master.id : "any") + "&date=" + state.date)
      .then(function(r) { return r.json(); }).then(function(j) {
        wrap.innerHTML = "";
        if (!j.ok || !j.slots.length) { wrap.innerHTML = '<div class="empty">На цю дату вільних віконець немає. Спробуйте іншу дату.</div>'; return; }
        var grid = document.createElement("div"); grid.className = "slots";
        j.slots.forEach(function(s) {
          var b = document.createElement("div"); b.className = "slot"; b.textContent = s.time;
          b.addEventListener("click", function() {
            grid.querySelectorAll(".slot").forEach(function(x) { x.classList.remove("sel"); });
            b.classList.add("sel"); state.start_min = s.start_min;
            setTimeout(function() { renderSummary(); goStep(6); }, 150);
          });
          grid.appendChild(b);
        });
        wrap.appendChild(grid);
      }).catch(function() { wrap.innerHTML = '<div class="empty">Помилка завантаження.</div>'; });
  }

  // Крок 6: Резюме
  function renderSummary() {
    var dt = new Date(state.date + "T00:00:00");
    var h = Math.floor(state.start_min/60), m = state.start_min%60;
    var time = String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
    var p = parseName(state.service.name);
    $("summary").innerHTML =
      "Послуга: <b>" + p.cat + "</b><br>" +
      "Майстер: <b>" + state.master.name + "</b><br>" +
      "Тривалість: <b>" + state.service.duration_min + " хв</b><br>" +
      "Ціна: <b>" + money(state.service.price) + "</b><br>" +
      "Дата: <b>" + DOW[dt.getDay()] + ", " + state.date.split("-").reverse().slice(0,2).join(".") + "</b><br>" +
      "Час: <b>" + time + "</b>";
  }

  // Бронювання
  $("bookBtn").addEventListener("click", function() {
    var name = $("nameInput").value.trim(), phone = $("phoneInput").value.trim();
    var err = $("bookErr"); err.textContent = "";
    if (!name) { err.textContent = "Вкажіть ім'я"; return; }
    if (!isValidPhone(phone)) { err.textContent = "Ви вказали невірний номер — формат: +380667894576"; return; }
    var btn = this; btn.disabled = true; btn.textContent = "Зачекайте…";
    fetch("/api/public/book", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ service: state.service.id, master: state.master.id, date: state.date, start_min: state.start_min, name: name, phone: phone, comment: $("commentInput").value.trim() })
    }).then(function(r) { return r.json().then(function(j) { return { code: r.status, j: j }; }); })
      .then(function(res) {
        btn.disabled = false; btn.textContent = "Підтвердити запис";
        if (res.code === 409) { err.textContent = "Це віконце щойно зайняли. Оберіть інший час."; setTimeout(function() { goStep(5); goDate(); }, 1000); return; }
        if (!res.j.ok) { err.textContent = "Помилка. Спробуйте ще раз."; return; }
        var p = parseName(state.service.name);
        var h = Math.floor(state.start_min/60), m = state.start_min%60;
        $("doneText").innerHTML = "Нагадаємо про візит за 24 години.<br><br><b>" + p.cat + "</b> · " + state.master.name + "<br>" + state.date.split("-").reverse().slice(0,2).join(".") + ", " + String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
        goStep("done");
      }).catch(function() { btn.disabled = false; btn.textContent = "Підтвердити запис"; err.textContent = "Помилка з'єднання."; });
  });
})();
</script>
</body>
</html>
