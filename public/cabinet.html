<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Oliva — Кабінет CRM</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#7A9156" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Oliva CRM" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black:#1a2016; --panel:#ffffff; --panel-2:#f4f6f1;
    --olive:#3d5430; --olive-light:#6e9145; --cream:#1c2818;
    --text:#323d2a; --text-dim:#6a7a60; --line:rgba(0,0,0,.1); --err:#c04040;
    --ok:#6e9145; --warn:#9b7820;
  }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body { font-family:'Inter',sans-serif; background:#f0f2ee; color:var(--text); min-height:100vh;
    overflow-x:hidden; overscroll-behavior:none; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; }
  .pf { font-family:'Playfair Display',serif; }
  button { font-family:inherit; cursor:pointer; }
  input, select, textarea { font-family:inherit; }

  /* login */
  .login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px; text-align:center; }
  .login-card img { width:60px; height:60px; object-fit:contain; margin:0 auto 12px; display:block; }
  .login-card h1 { font-size:1.3rem; color:var(--cream); margin-bottom:4px; }
  .login-card p { font-size:.83rem; color:var(--text-dim); margin-bottom:20px; }
  .login-card input { width:100%; background:#f5f5f3; border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--cream); font-size:.95rem; margin-bottom:10px; }
  .login-card button { width:100%; background:var(--olive-light); color:var(--black); border:none; border-radius:10px; padding:12px; font-size:.95rem; font-weight:600; }
  .login-err { color:var(--err); font-size:.82rem; margin-top:10px; min-height:18px; }

  /* app */
  .app { display:none; }
  .app.on { display:block; }
  .topbar { position:sticky; top:0; z-index:30; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
    padding:max(8px, env(safe-area-inset-top, 8px)) 16px 8px; }
  .topbar img { width:26px; height:26px; object-fit:contain; flex-shrink:0; }
  .topbar .pf { color:var(--cream); font-size:.95rem; white-space:nowrap; flex-shrink:0; }
  .topbar .role { font-size:.68rem; color:var(--olive-light); background:rgba(122,145,86,.12); padding:2px 8px; border-radius:20px; flex-shrink:0; }
  .topbar .tabs-inline { display:flex; gap:2px; overflow-x:auto; flex:1; scrollbar-width:none; }
  .topbar .tabs-inline::-webkit-scrollbar { display:none; }
  .topbar button.logout { background:none; border:1px solid var(--line); color:var(--text-dim); border-radius:8px; padding:6px 12px; font-size:.78rem; flex-shrink:0; }
  .topbar button.logout:hover { color:var(--cream); border-color:var(--olive-light); }
  .tab { background:none; border:none; color:var(--text-dim); padding:6px 12px; border-radius:7px; font-size:.82rem; white-space:nowrap; cursor:pointer; }
  .tab.on { background:rgba(122,145,86,.16); color:var(--cream); }

  .main { max-width:980px; margin:0 auto; padding:18px 14px 80px; }
  .pane { display:none; } .pane.on { display:block; }

  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .bar h2 { font-family:'Playfair Display',serif; color:var(--cream); font-size:1.2rem; font-weight:500; margin-right:auto; }
  input[type=date], input[type=text], input[type=tel], input[type=number],
  input[type=password], input[type=time], select, textarea {
    background:#f5f5f3; border:1px solid var(--line); border-radius:9px; padding:9px 12px; color:var(--cream); font-size:.9rem; outline:none;
  }
  input[type=date]:focus, input[type=text]:focus, input[type=tel]:focus, input[type=number]:focus,
  input[type=password]:focus, input[type=time]:focus, select:focus, textarea:focus {
    border-color:var(--olive-light); box-shadow:0 0 0 2px rgba(122,145,86,.18);
  }
  textarea { width:100%; resize:vertical; min-height:64px; }
  .btn { border:none; border-radius:9px; padding:9px 16px; font-size:.88rem; font-weight:600; }
  .btn-primary { background:var(--olive-light); color:var(--black); }
  .btn-primary:hover { background:#8FA864; }
  .btn-ghost { background:none; border:1px solid var(--line); color:var(--text-dim); }
  .btn-ghost:hover { color:var(--cream); border-color:var(--olive-light); }
  .btn-sm { padding:5px 10px; font-size:.78rem; font-weight:500; border-radius:7px; }

  .list { display:flex; flex-direction:column; gap:10px; }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
  .item .row1 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .item .t { font-size:1rem; color:var(--cream); font-weight:500; }
  .item .sub { color:var(--text-dim); font-size:.82rem; margin-top:3px; }
  .item .sp { flex:1; }
  .badge { font-size:.72rem; padding:3px 9px; border-radius:20px; font-weight:500; }
  .b-pending { background:rgba(202,164,90,.16); color:var(--warn); }
  .b-confirmed { background:rgba(122,145,86,.18); color:var(--olive-light); }
  .b-completed { background:rgba(122,145,86,.28); color:var(--cream); }
  .b-cancelled, .b-no_show { background:rgba(224,129,107,.16); color:var(--err); }
  .b-sent { background:rgba(202,164,90,.16); color:var(--warn); }
  .b-delivered { background:rgba(122,145,86,.2); color:var(--olive-light); }
  .b-undelivered, .b-failed { background:rgba(224,129,107,.16); color:var(--err); }
  .b-queued { background:rgba(138,136,128,.18); color:var(--text-dim); }
  .acts { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .empty { color:var(--text-dim); text-align:center; padding:30px 0; font-size:.9rem; }

  /* modal */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto; }
  .modal.on { display:flex; }
  .modal-card { width:100%; max-width:520px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; }
  .modal-card.wide { max-width:660px; }
  .modal-card h3 { font-family:'Playfair Display',serif; color:var(--cream); font-size:1.15rem; margin-bottom:16px; font-weight:500; }
  .modal-card label { display:block; font-size:.78rem; color:var(--text-dim); margin:10px 0 5px; }
  .modal-card input, .modal-card select, .modal-card textarea { width:100%; }
  /* flex-wrap: в деталях запису тут може бути аж 5 кнопок одночасно
     (Підтвердити/Завершити/Не прийшов/Скасувати/Закрити) — без переносу
     вони не стискались нижче ширини свого тексту й вилазили за картку
     й за екран на вузьких телефонах. */
  .modal-foot { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  .modal-foot .btn { flex:1; min-width:110px; }
  .pass-wrap { position:relative; display:block; }
  .pass-wrap input { width:100%; padding-right:44px; box-sizing:border-box; }
  .pass-wrap input::-ms-reveal, .pass-wrap input::-ms-clear { display:none !important; }
  .pass-eye { position:absolute; right:0; top:0; bottom:0; width:42px; display:flex; align-items:center; justify-content:center; background:#eeeeeb; border:none; border-left:1px solid var(--line); border-radius:0 9px 9px 0; cursor:pointer; color:var(--text-dim); transition:color .2s; }
  .pass-eye:hover { color:var(--olive-light); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip { border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:.8rem; color:var(--text-dim); }
  .chip.on { background:rgba(122,145,86,.18); color:var(--cream); border-color:var(--olive-light); }
  .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:7px; margin-top:6px; }
  .slot { background:rgba(0,0,0,.04); border:1px solid var(--line); border-radius:8px; padding:9px 0; text-align:center; font-size:.85rem; color:var(--cream); }
  .slot.sel { background:var(--olive-light); color:var(--black); font-weight:600; }
  .sched-grid { display:flex; flex-direction:column; gap:5px; margin-top:10px; }
  /* flex-wrap: у рядку день + робочі години + "перерва" + її години —
     забагато для вузького екрана в один рядок; work-group/break-group
     тепер переносяться цілим блоком, а не обрізаються по краю картки. */
  .sched-row { display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; background:rgba(0,0,0,.03); border:1px solid var(--line); border-radius:10px; padding:8px 12px; transition:opacity .2s; }
  .sched-row.day-off { opacity:.4; }
  .sched-row .wd { width:28px; font-size:.8rem; font-weight:700; color:var(--olive-light); text-align:center; flex-shrink:0; }
  .sched-row.day-off .wd { color:var(--text-dim); }
  .sched-row .sched-group { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .sched-row .sched-lbl { font-size:.7rem; color:var(--text-dim); margin-right:2px; flex-shrink:0; }
  .sched-row .sched-sep { color:var(--text-dim); font-size:.85rem; flex-shrink:0; }
  .sched-row input[type=time] { width:88px; flex-shrink:0; padding:6px 7px; font-size:.83rem; }
  .err { color:var(--err); font-size:.82rem; min-height:18px; margin-top:6px; }
  .muted { color:var(--text-dim); font-size:.82rem; }

  /* ── МОБІЛЬНА НАВІГАЦІЯ ── */
  #mob-nav { display:none; }
  @media(max-width:680px){
    /* Шапка: прибрати вкладки та кнопку виходу */
    .topbar .tabs-inline { display:none !important; }
    .topbar .logout { display:none !important; }
    .topbar { padding:max(8px, env(safe-area-inset-top, 8px)) 12px 8px; gap:8px; }
    /* Головний контент: відступ знизу для nav-bar */
    .main { padding-bottom:84px; padding-left:10px; padding-right:10px; }
    /* Модалка: відступ знизу щоб клавіатура не перекривала */
    /* safe flex-end, не просто flex-end: коли картка вища за екран (напр.
       графік на 7 днів), звичайний flex-end анкорить її знизу і робить
       верх недоступним для скролу — scrollHeight у браузера рахувався
       рівним clientHeight, хоча заголовок фізично стояв за межами екрана. */
    .modal { padding:12px 10px 92px; align-items:safe flex-end; }
    .modal-card { border-radius:16px; }
    /* Таблиці в картках — горизонтальний скрол */
    .item { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    /* Кнопки «Записи» — в ряд на весь рядок */
    .acts { gap:8px; }
    .acts .btn { flex:1; font-size:.8rem; padding:8px 6px; }
    /* grid2 → одна колонка */
    .grid2 { grid-template-columns:1fr; }
    /* bar — переносити на новий рядок */
    .bar { gap:8px; }
    .bar input[type=date] { font-size:.85rem; padding:7px 8px; }
    /* нижня навігація */
    #mob-nav {
      display:flex;
      position:fixed; bottom:0; left:0; right:0; z-index:50;
      background:var(--panel); border-top:1px solid var(--line);
      padding:6px 0 max(8px, env(safe-area-inset-bottom, 8px));
    }
  }
  .mob-tab {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; color:var(--text-dim); font-size:.6rem;
    padding:5px 2px; min-width:0; transition:color .15s; cursor:pointer;
  }
  .mob-tab .mico { font-size:1.3rem; line-height:1.15; }
  .mob-tab.on { color:var(--olive-light); }
  /* Backdrop */
  #mob-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; }
  #mob-backdrop.open { display:block; }
  /* Drawer знизу */
  #mob-sheet {
    position:fixed; bottom:0; left:0; right:0; z-index:61;
    background:var(--panel-2); border:1px solid var(--line); border-top-color:var(--olive-light);
    border-radius:18px 18px 0 0;
    padding-bottom:max(16px, env(safe-area-inset-bottom, 16px));
    transform:translateY(100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  #mob-sheet.open { transform:translateY(0); }
  .mob-sheet-handle { width:44px; height:4px; background:var(--line); border-radius:2px; margin:12px auto 8px; }
  .mob-sheet-item {
    display:flex; align-items:center; gap:14px; width:100%; background:none; border:none;
    color:var(--text); font-size:.95rem; padding:14px 24px; text-align:left; cursor:pointer;
  }
  .mob-sheet-item:active { background:rgba(122,145,86,.07); }
  .mob-sheet-item.on { color:var(--olive-light); background:rgba(122,145,86,.1); }
  .mob-sheet-sep { height:1px; background:var(--line); margin:6px 16px; }
  /* ── Push-тост ── */
  #push-toast {
    position:fixed; bottom:calc(68px + env(safe-area-inset-bottom,0px));
    left:12px; right:12px; z-index:55;
    background:var(--panel-2); border:1px solid var(--olive-light);
    border-radius:14px; padding:14px 16px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow:0 4px 28px rgba(0,0,0,.12);
    animation:pushToastIn .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes pushToastIn { from{transform:translateY(80px);opacity:0} to{transform:translateY(0);opacity:1} }
  #push-toast .pt-msg { font-size:.9rem; color:var(--cream); line-height:1.4; }
  #push-toast .pt-btns { display:flex; gap:8px; }

  /* Розкривна детальна аналітика в картці майстра.
     list-style:none прибирає маркер у Chrome, але в Safari (iOS) трикутник
     лишається — потрібне саме -webkit-details-marker. */
  details.da-more > summary { list-style:none; }
  details.da-more > summary::-webkit-details-marker { display:none; }
  details.da-more > summary .da-caret { display:inline-block; transition:transform .15s; }
  details.da-more[open] > summary .da-caret { transform:rotate(180deg); }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-card">
    <img src="assets/img/logo.png" alt="Oliva" />
    <h1 class="pf">Кабінет CRM</h1>
    <p>Студія масажу Oliva</p>
    <input type="text" id="loginUser" placeholder="Логін (майстри) — власник лишає порожнім" autocomplete="username" />
    <input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password" />
    <button id="loginBtn">Увійти</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="topbar">
    <img src="assets/img/logo.png" alt="" />
    <span class="pf">Oliva CRM</span>
    <span class="role" id="roleTag"></span>
    <div class="tabs-inline" id="tabs"></div>
    <button class="logout" id="logoutBtn">Вийти</button>
  </div>
  <div class="main" id="main"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<script src="assets/js/cabinet.js?v=101"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
    // Коли новий service worker бере контроль — перезавантажуємо сторінку
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      window.location.reload();
    });
  }
</script>

<!-- МОБІЛЬНА НАВІГАЦІЯ -->
<div id="mob-backdrop"></div>
<div id="mob-sheet">
  <div class="mob-sheet-handle"></div>
  <div id="mob-sheet-list"></div>
  <div class="mob-sheet-sep"></div>
  <button id="mob-sheet-logout" class="mob-sheet-item" style="color:var(--err);">🚪&nbsp; Вийти</button>
</div>
<div id="mob-nav"></div>
</body>
</html>
