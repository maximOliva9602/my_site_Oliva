<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Про масаж — Студія масажу Oliva</title>
  <meta name="description" content="" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="article" />
  <meta property="og:locale" content="uk_UA" />
  <meta property="og:site_name" content="Студія масажу Oliva" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:url" content="" />
  <meta property="og:image" content="https://massage-oliva.com/assets/img/og-image.jpg" />
  <link rel="canonical" href="" />
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #080A07; --black-2: #0e120c; --olive: #2E3D22; --olive-light: #7A9156;
      --cream: #F2EDE4; --warm: #E8DFD0; --text-dim: rgba(242,237,228,0.6); --line: rgba(122,145,86,0.18);
      --panel: rgba(242,237,228,0.04);
    }
    html, body { min-height: 100vh; background: var(--black); color: var(--cream); font-family: 'Inter', sans-serif; overflow-x: hidden; }
    img { max-width: 100%; display: block; }
    /* Той самий скид, що в styles.css на головній — без нього всі
       контактні посилання лишались підкресленими. */
    a { color: inherit; text-decoration: none; }

    .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--black); z-index: 10; }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 36px; height: 36px; object-fit: contain; }
    .nav-logo span { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--cream); }
    .nav-back { font-size: 13px; color: var(--olive-light); text-decoration: none; }
    .nav-back:hover { color: var(--cream); }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
    .loading { text-align: center; padding: 100px 24px; color: var(--text-dim); }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: 600; text-decoration: none; transition: all .2s; white-space: nowrap; }
    .btn-primary { background: var(--olive-light); color: var(--black); border: none; }
    .btn-primary:hover { background: var(--cream); }
    .btn-secondary { background: rgba(8,10,7,0.45); border: 1.5px solid var(--olive-light); color: var(--olive-light); }
    .btn-secondary:hover { background: rgba(122,145,86,0.25); color: var(--cream); border-color: var(--cream); }

    @keyframes btnPulse {
      0% { box-shadow: 0 0 0 0 rgba(122,145,86,0.75); transform: scale(1); }
      50% { transform: scale(1.05); }
      70% { box-shadow: 0 0 0 22px rgba(122,145,86,0); }
      100% { box-shadow: 0 0 0 0 rgba(122,145,86,0); transform: scale(1); }
    }
    .hero .hero-btns .btn { animation: btnPulse 1.8s ease-out infinite; }
    .hero .hero-btns .btn:hover { animation-play-state: paused; }

    /* HERO */
    .hero { position: relative; min-height: 74vh; display: flex; align-items: center; padding: 60px 0 56px; }
    .hero--compact { min-height: 52vh; }
    .hero--tall { min-height: 92vh; }
    .hero-bg { position: absolute; inset: 0; object-fit: cover; width: 100%; height: 100%; z-index: 0; }
    .hero-bg-fallback { position: absolute; inset: 0; background: linear-gradient(160deg, #1c2415, var(--black)); z-index: 0; }
    /* На десктопі фото свідомо кадроване так, щоб під заголовком і кнопками
       лишалась темна ділянка — оверлей там зайвий. На вузьких екранах те
       саме фото кадрується інакше (object-fit:cover обрізає вужче й вище),
       і та темна ділянка зникає — текст і кнопки лягають просто на обличчя
       й яскраві свічки. Вмикаємо оверлей лише в мобільному медіазапиті
       нижче, а не тут. */
    .hero-overlay { display: none; }
    /* .hero — flex-контейнер (для вертикального вирівнювання по низу), тому
       .wrap усередині не тягнеться до max-width сам — розтягуємо явно,
       інакше текст «зʼїжджає» значно правіше, ніж в інших секціях сторінки. */
    .hero .wrap { width: 100%; }
    .hero-inner { position: relative; z-index: 2; max-width: 640px; }
    .hero-inner--right { margin-left: auto; margin-right: -140px; max-width: 620px; }
    .hero-eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 14px; font-weight: 600; }
    .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.12; margin-bottom: 14px; text-transform: uppercase; }
    .hero-tagline { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--cream); opacity: .92; margin-bottom: 18px; line-height: 1.4; }
    .hero-desc { font-size: 15px; color: var(--text-dim); line-height: 1.7; max-width: 520px; margin-bottom: 26px; }
    .hero-sub { padding: 44px 24px 0; text-align: center; }
    .hero-sub .hero-tagline, .hero-sub .hero-desc { margin: 0 auto 16px; max-width: 900px; text-align: center; }
    .hero-sub .hero-tagline { font-size: clamp(1.2rem, 2.6vw, 1.6rem); }
    .hero-sub .hero-desc { margin-bottom: 0; font-size: 16px; }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }

    section.block { padding: 72px 0; }
    .block-title { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 3vw, 2.1rem); color: var(--cream); margin-bottom: 32px; }

    /* SYMPTOMS */
    .symptoms { background: var(--panel); }
    .symptoms .wrap { max-width: 1400px; }
    .symptoms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .symptoms-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .symptoms-item { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; color: var(--cream); line-height: 1.5; }
    .symptoms-item .dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--olive-light); margin-top: 7px; }
    .symptoms-photo { border-radius: 18px; overflow: hidden; aspect-ratio: 4/3; }
    .symptoms-photo--square { aspect-ratio: 1/1; }
    .symptoms-photo--wide { aspect-ratio: 16/9; }
    .symptoms-photo--tall { aspect-ratio: 3/4; }
    .symptoms-photo img { width: 100%; height: 100%; object-fit: cover; }
    .symptoms-quote { background: var(--olive); border-radius: 14px; padding: 20px 24px; font-size: 15px; color: var(--cream); font-weight: 600; line-height: 1.5; }

    /* BENEFITS */
    .benefits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 32px; }
    .benefits-grid--last { margin-bottom: 0; }
    .benefit-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
    .benefit-title { font-weight: 700; color: var(--cream); font-size: 15px; margin-bottom: 6px; }
    .benefit-text { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }

    /* STEPS */
    .steps-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 28px; position: relative; }
    .step { position: relative; }
    .step-num { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--olive-light); opacity: .55; margin-bottom: 10px; }
    .step-title { font-weight: 700; color: var(--cream); font-size: 15px; margin-bottom: 6px; }
    .step-text { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }
    /* Фото кроку — необов'язкове (третя частина рядка в адмінці). */
    /* Розділ із кроками тримаємо компактнішим за решту блоків —
       з фото він і так високий. */
    section.block.steps-section { padding: 40px 0 44px; }
    .steps-section .block-title { margin-bottom: 22px; }
    .steps-row--photos { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .step-photo { border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 12px; background: var(--panel); }
    .step-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .step-photo--empty { background: none; }

    /* DETAIL / PRICING */
    .detail { background: var(--panel); }
    .detail-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; }
    .detail-eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 10px; }
    .detail-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 14px; }
    .detail-desc { font-size: 14.5px; color: var(--text-dim); line-height: 1.7; margin-bottom: 22px; }
    .suitable-title { font-weight: 700; color: var(--cream); margin-bottom: 14px; font-size: 15px; }
    .suitable-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
    .suitable-item { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--text-dim); line-height: 1.5; }
    .suitable-item .check { color: var(--olive-light); flex-shrink: 0; font-weight: 700; }
    .price-table { background: var(--black); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
    .price-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .price-row:last-child { border-bottom: none; }
    .price-dur { color: var(--cream); font-weight: 600; }
    .price-vals { display: flex; gap: 16px; color: var(--text-dim); font-size: 13px; }
    .price-vals b { color: var(--olive-light); }
    .detail-loc { font-size: 12.5px; color: var(--text-dim); margin-top: 14px; }

    /* ABONEMENTS */
    .abon-section { padding: 8px 24px 40px; }
    .abon-block { max-width: 1080px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 36px; }
    .abon-grid { display: grid; grid-template-columns: 290px 1fr; gap: 32px; align-items: center; }
    .abon-info-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: .01em; text-transform: uppercase; color: var(--olive-light); font-weight: 700; margin-bottom: 10px; }
    .abon-info-sub { font-size: 14px; color: var(--text-dim); line-height: 1.5; margin-bottom: 18px; }
    .abon-info-box { border: 1px solid var(--line); border-radius: 16px; padding: 24px; min-width: 0; }
    .abon-price-col { border-right: 2px solid rgba(122,145,86,0.35); padding-right: 32px; }
    /* Послуга без абонементів — лишається сама колонка з ціною:
       без розділювача й на всю ширину картки. */
    .abon-block--price-only { max-width: 520px; }
    .abon-price-col--solo { border-right: none; padding-right: 0; }
    .abon-price-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--olive-light); font-weight: 700; margin-bottom: 10px; }
    .abon-price-big { font-family: 'Playfair Display', serif; font-size: 3.1rem; color: var(--cream); font-weight: 700; line-height: 1; margin-bottom: 18px; white-space: nowrap; }
    .abon-price-big span { font-size: 1.1rem; color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 400; }
    .abon-cards-wrap { position: relative; }
    .abon-carousel-arrow { display: none; }
    .abon-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .abon-card { position: relative; background: var(--black); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; }
    .abon-card--popular { border-color: var(--olive-light); }
    .abon-card-popular-label { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--olive-light); color: var(--black); padding: 3px 12px; border-radius: 20px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
    .abon-badge { position: absolute; top: 16px; right: 16px; background: rgba(122,145,86,0.2); color: var(--olive-light); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
    .abon-card-title { font-size: 14px; color: var(--cream); margin-bottom: 12px; font-weight: 600; }
    .abon-card-price { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--cream); font-weight: 700; line-height: 1; }
    .abon-card-persession { font-size: 12px; color: var(--text-dim); margin: 6px 0 16px; }
    .abon-card-divider { border-top: 1px solid var(--line); margin-bottom: 12px; }
    .abon-card-total { font-size: 12.5px; color: var(--text-dim); }
    .abon-card-total b { color: var(--cream); }
    .abon-card-total del { opacity: .55; margin-left: 6px; }
    .abon-card--levels .abon-badge { top: 16px; }
    .abon-levels { display: flex; flex-direction: column; gap: 10px; }
    .abon-level-row { display: flex; flex-direction: column; gap: 3px; padding-top: 10px; border-top: 1px solid var(--line); }
    .abon-level-row:first-child { padding-top: 0; border-top: none; }
    .abon-level-name { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
    .abon-level-total { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--cream); font-weight: 700; }
    .abon-level-total-label { font-weight: 400; }
    .abon-level-total del { font-family: 'Inter', sans-serif; font-weight: 400; font-size: .7em; opacity: .55; margin-left: 6px; }
    .abon-duration-switch-wrap, .abon-level-switch-wrap { display: flex; margin-bottom: 12px; }
    .abon-duration-switch, .abon-level-switch { display: inline-flex; gap: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 30px; padding: 4px; }
    .abon-duration-btn, .abon-level-btn { padding: 7px 16px; border-radius: 30px; font-size: 12.5px; color: var(--text-dim); background: none; border: none; cursor: pointer; font-family: inherit; transition: all .2s; }
    .abon-duration-btn.active, .abon-level-btn.active { background: var(--olive); color: var(--cream); }
    .abon-level-switch-wrap { margin-bottom: 16px; }
    @media (max-width: 780px) {
      .abon-grid { grid-template-columns: 1fr; text-align: center; }
      /* Три картки абонементів у стовпчик займали весь екран прокрутки —
         на мобільному робимо їх горизонтальною каруселлю: свайп замість
         довгого скролу вниз, з "підглядом" наступної картки для підказки. */
      .abon-cards {
        display: flex;
        grid-template-columns: none;
        overflow-x: auto;
        /* overflow-x:auto змушує браузер порахувати overflow-y як auto
           теж (сам overflow-x без сусіда "visible" по обох осях
           неможливий) — той самий скрол-контейнер обрізав бейдж
           "Найпопулярніший", який навмисно стирчить над карткою
           (top:-12px). Компенсуємо відступом зверху, щоб бейджу було
           куди стирчати, а не ховатись за межею скролу. */
        overflow-y: visible;
        scroll-snap-type: x mandatory;
        gap: 14px;
        margin: 0 -4px;
        padding: 20px 4px 10px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .abon-cards::-webkit-scrollbar { display: none; }
      .abon-card { scroll-snap-align: center; flex: 0 0 82%; }
      .abon-price-col { border-right: none; padding-right: 0; padding-bottom: 24px; border-bottom: 2px solid rgba(122,145,86,0.35); margin-bottom: 24px; }
      .abon-duration-switch-wrap, .abon-level-switch-wrap { justify-content: center; }
      /* Підказка, що карток більше однієї й можна гортати — самого
         "підгляду" країв сусідніх карток виявилось недостатньо, власник
         попросив явні стрілки. */
      .abon-carousel-arrow {
        display: flex; align-items: center; justify-content: center;
        position: absolute; top: 50%; transform: translateY(-50%);
        width: 34px; height: 34px; border-radius: 50%;
        background: rgba(8,10,7,0.75); border: 1px solid rgba(122,145,86,0.5);
        color: var(--cream); font-size: 20px; line-height: 1; cursor: pointer;
        z-index: 6; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      }
      .abon-carousel-arrow--prev { left: -2px; }
      .abon-carousel-arrow--next { right: -2px; }
      .abon-carousel-arrow[disabled] { opacity: .35; pointer-events: none; }
    }

    .contacts-section { padding: 72px 24px; background: rgba(14,18,12,0.9); border-top: 1px solid var(--line); }
    .contacts-section .wrap { max-width: 1080px; margin: 0 auto; }
    .contacts-section .section-label { display: flex; align-items: center; gap: 10px; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 10px; }
    .contacts-section .section-label::before { content: ''; width: 24px; height: 1px; background: var(--olive-light); }
    .contacts-section .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 3.5vw, 3rem); line-height: 1.15; color: var(--cream); margin-bottom: 16px; }
    .contacts-grid { display: grid; grid-template-columns: 340px 1fr; gap: 48px; align-items: start; margin-top: 56px; }
    .contact-block { margin-bottom: 32px; }
    .contact-label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 8px; }
    .contact-value { font-size: 1.1rem; color: var(--cream); text-decoration: none; transition: color .25s; }
    a.contact-value:hover { color: var(--olive-light); }
    .social-row { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .social-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(46,61,34,0.4); border: 1px solid rgba(122,145,86,0.3); display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: all .3s; }
    .social-btn svg { width: 22px; height: 22px; }
    .social-btn--instagram { color: #e1306c !important; border-color: rgba(225,48,108,.3) !important; }
    .social-btn--instagram:hover { background: rgba(225,48,108,.12) !important; border-color: #e1306c !important; }
    .social-btn--tiktok { color: #fff !important; border-color: rgba(255,255,255,.3) !important; }
    .social-btn--tiktok:hover { background: rgba(255,255,255,.12) !important; border-color: #fff !important; }
    .social-btn--threads { color: #fff !important; border-color: rgba(255,255,255,.3) !important; }
    .social-btn--threads:hover { background: rgba(255,255,255,.12) !important; border-color: #fff !important; }
    .social-btn--whatsapp { color: #25d366 !important; border-color: rgba(37,211,102,.3) !important; }
    .social-btn--whatsapp:hover { background: rgba(37,211,102,.12) !important; border-color: #25d366 !important; }
    .social-btn--viber { color: #7360f2 !important; border-color: rgba(115,96,242,.3) !important; }
    .social-btn--viber:hover { background: rgba(115,96,242,.12) !important; border-color: #7360f2 !important; }
    .social-btn--telegram { color: #229ed9 !important; border-color: rgba(34,158,217,.3) !important; }
    .social-btn--telegram:hover { background: rgba(34,158,217,.12) !important; border-color: #229ed9 !important; }
    .social-btn--youtube { color: #ff0000 !important; border-color: rgba(255,0,0,.3) !important; }
    .social-btn--youtube:hover { background: rgba(255,0,0,.12) !important; border-color: #ff0000 !important; }
    /* Дві філії — дві окремі підписані карти поруч (зліва й справа). На
       вузьких екранах (медіазапит нижче) переносимо в стовпчик. */
    .map-embed-wrap { display: flex; flex-direction: row; gap: 20px; }
    .map-embed-item { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
    .map-embed-label { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--olive-light); }
    .map-open-link { font-size: 13px; color: var(--olive-light); text-decoration: none; text-align: center; }
    .map-open-link:hover { color: var(--cream); }
    .map-links { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; }
    @media (max-width: 780px) {
      .contacts-grid { grid-template-columns: 1fr; gap: 40px; }
    }
    @media (max-width: 480px) {
      .map-embed-wrap { flex-direction: column; }
    }

    /* FLOATING ACTIONS (запис + чат) — завжди по вертикальному центру справа */
    .floating-actions { position: fixed; top: 50%; right: 24px; transform: translateY(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 14px; }

<script>
(function () {
  /* Категорійна сторінка (/spa-dlya-dvoh-kyiv) — повністю готова з сервера. */
  if (window.__SVC_STATIC__) return;
  var content = document.getElementById('pageContent');
  var SP = window.OlivaServicePage, SG = window.OlivaServiceGroups;
  /* Сервер уже відрендерив сторінку й поклав дані сюди — жодних зайвих
     запитів. Якщо сторінка прийшла без них (напр. стара копія з кешу) —
     догружаємо, як раніше. */
  var boot = window.__SVC_PAGE__;
  var loaded = boot ? Promise.resolve(boot) : Promise.all([
    fetch('/api/service-pages/' + encodeURIComponent(decodeURIComponent(location.pathname.split('/').pop() || ''))).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
    fetch('/api/services').then(function(r){ return r.json(); }).catch(function(){ return { services: [] }; }),
    fetch('/api/public/branches').then(function(r){ return r.json(); }).catch(function(){ return { branches: [] }; }),
  ]).then(function (rs) {
    if (!rs[0] || !rs[0].ok) return null;
    return { page: rs[0].page, services: rs[1].services || [], branches: rs[2].branches || [], related: rs[0].related || [], categoryLink: rs[0].categoryLink || null, path: location.pathname };
  });

  loaded.then(function (data) {
    if (!data) {
      content.innerHTML = '<div class="loading">Сторінку не знайдено. <a href="/#services" style="color:var(--olive-light)">← До послуг</a></div>';
      return;
    }
    var r = SP.build({ page: data.page, services: data.services, branches: data.branches, groups: SG, related: data.related, categoryLink: data.categoryLink, path: data.path || location.pathname });
    /* Серверна розмітка ідентична — перемальовуємо лише якщо її не було. */
    if (!boot) { content.innerHTML = r.html; document.title = r.seoTitle; }
    var ctx = r.ctx, st = ctx.state;

    /* На мобільному картки абонементів — карусель; центруємо «Найпопулярніший»
       вручну через scrollLeft (scrollIntoView стрибав сторінкою вниз). */
    function centerPopularCard(box) {
      if (!box || window.matchMedia('(min-width: 781px)').matches) return;
      var popular = box.querySelector('.abon-card--popular');
      if (!popular) return;
      var target = popular.offsetLeft - (box.clientWidth - popular.offsetWidth) / 2;
      box.scrollLeft = Math.max(0, target);
    }
    content.querySelectorAll('.abon-cards[data-abon-group]').forEach(function(box){
      if (box.style.display !== 'none') centerPopularCard(box);
    });
    function activeAbonBox() {
      var boxes = content.querySelectorAll('.abon-cards[data-abon-group]');
      for (var i = 0; i < boxes.length; i++) if (boxes[i].style.display !== 'none') return boxes[i];
      return null;
    }
    function updateArrowState() {
      var box = activeAbonBox();
      var prev = content.querySelector('.abon-carousel-arrow--prev');
      var next = content.querySelector('.abon-carousel-arrow--next');
      if (!box || !prev || !next) return;
      var maxScroll = box.scrollWidth - box.clientWidth;
      prev.disabled = box.scrollLeft <= 1;
      next.disabled = box.scrollLeft >= maxScroll - 1;
    }
    content.querySelectorAll('.abon-carousel-arrow').forEach(function(btn){
      btn.addEventListener('click', function(){
        var box = activeAbonBox();
        if (!box) return;
        var card = box.querySelector('.abon-card');
        var cardWidth = card ? card.getBoundingClientRect().width : box.clientWidth * 0.82;
        var dir = parseInt(btn.getAttribute('data-abon-dir'), 10);
        /* 'instant' — з scroll-snap 'smooth' деякі рушії ігнорують. */
        box.scrollBy({ left: dir * (cardWidth + 14), behavior: 'instant' });
      });
    });
    content.querySelectorAll('.abon-cards[data-abon-group]').forEach(function(box){
      box.addEventListener('scroll', updateArrowState, { passive: true });
    });
    updateArrowState();

    function updateAbonPrice(){
      var big = content.querySelector('#abonPriceBig');
      var pr = ctx.realPriceFor(ctx.activeDurNum(), st.level);
      if (big && pr) big.innerHTML = ctx.priceBigHtml(pr);
    }
    content.querySelectorAll('.abon-duration-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        st.durIdx = parseInt(btn.getAttribute('data-abon-dur'), 10);
        content.querySelectorAll('.abon-duration-btn').forEach(function(b){ b.classList.toggle('active', b === btn); });
        var anyShown = false;
        content.querySelectorAll('.abon-cards[data-abon-group]').forEach(function(box){
          var isActive = ctx.groupVisible(parseInt(box.getAttribute('data-abon-group'), 10));
          box.style.display = isActive ? '' : 'none';
          if (isActive) { anyShown = true; centerPopularCard(box); }
        });
        var none = content.querySelector('.abon-none');
        if (none) none.style.display = anyShown ? 'none' : '';
        updateAbonPrice();
        updateArrowState();
      });
    });
    content.querySelectorAll('.abon-level-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        st.level = btn.getAttribute('data-abon-level');
        content.querySelectorAll('.abon-level-btn').forEach(function(b){ b.classList.toggle('active', b === btn); });
        updateAbonPrice();
      });
    });
  });
})();
</script>
