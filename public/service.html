<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Про масаж — Студія масажу Oliva</title>
  <meta name="description" content="" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="article" />
  <meta property="og:locale" content="uk_UA" />
  <meta property="og:site_name" content="Студія масажу Oliva" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:url" content="" />
  <meta property="og:image" content="https://massage-oliva.com/assets/img/og-image.jpg" />
  <link rel="canonical" href="" />
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #080A07; --black-2: #0e120c; --olive: #2E3D22; --olive-light: #7A9156;
      --cream: #F2EDE4; --warm: #E8DFD0; --text-dim: rgba(242,237,228,0.6); --line: rgba(122,145,86,0.18);
      --panel: rgba(242,237,228,0.04);
    }
    html, body { min-height: 100vh; background: var(--black); color: var(--cream); font-family: 'Inter', sans-serif; overflow-x: hidden; }
    img { max-width: 100%; display: block; }
    /* Той самий скид, що в styles.css на головній — без нього всі
       контактні посилання лишались підкресленими. */
    a { color: inherit; text-decoration: none; }

    .nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--black); z-index: 10; }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 36px; height: 36px; object-fit: contain; }
    .nav-logo span { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--cream); }
    .nav-back { font-size: 13px; color: var(--olive-light); text-decoration: none; }
    .nav-back:hover { color: var(--cream); }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
    .loading { text-align: center; padding: 100px 24px; color: var(--text-dim); }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: 600; text-decoration: none; transition: all .2s; white-space: nowrap; }
    .btn-primary { background: var(--olive-light); color: var(--black); border: none; }
    .btn-primary:hover { background: var(--cream); }
    .btn-secondary { background: rgba(8,10,7,0.45); border: 1.5px solid var(--olive-light); color: var(--olive-light); }
    .btn-secondary:hover { background: rgba(122,145,86,0.25); color: var(--cream); border-color: var(--cream); }

    @keyframes btnPulse {
      0% { box-shadow: 0 0 0 0 rgba(122,145,86,0.75); transform: scale(1); }
      50% { transform: scale(1.05); }
      70% { box-shadow: 0 0 0 22px rgba(122,145,86,0); }
      100% { box-shadow: 0 0 0 0 rgba(122,145,86,0); transform: scale(1); }
    }
    .hero .hero-btns .btn { animation: btnPulse 1.8s ease-out infinite; }
    .hero .hero-btns .btn:hover { animation-play-state: paused; }

    /* HERO */
    .hero { position: relative; min-height: 74vh; display: flex; align-items: center; padding: 60px 0 56px; }
    .hero--compact { min-height: 52vh; }
    .hero--tall { min-height: 92vh; }
    .hero-bg { position: absolute; inset: 0; object-fit: cover; width: 100%; height: 100%; z-index: 0; }
    .hero-bg-fallback { position: absolute; inset: 0; background: linear-gradient(160deg, #1c2415, var(--black)); z-index: 0; }
    /* На десктопі фото свідомо кадроване так, щоб під заголовком і кнопками
       лишалась темна ділянка — оверлей там зайвий. На вузьких екранах те
       саме фото кадрується інакше (object-fit:cover обрізає вужче й вище),
       і та темна ділянка зникає — текст і кнопки лягають просто на обличчя
       й яскраві свічки. Вмикаємо оверлей лише в мобільному медіазапиті
       нижче, а не тут. */
    .hero-overlay { display: none; }
    /* .hero — flex-контейнер (для вертикального вирівнювання по низу), тому
       .wrap усередині не тягнеться до max-width сам — розтягуємо явно,
       інакше текст «зʼїжджає» значно правіше, ніж в інших секціях сторінки. */
    .hero .wrap { width: 100%; }
    .hero-inner { position: relative; z-index: 2; max-width: 640px; }
    .hero-inner--right { margin-left: auto; margin-right: -140px; max-width: 620px; }
    .hero-eyebrow { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 14px; font-weight: 600; }
    .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.12; margin-bottom: 14px; text-transform: uppercase; }
    .hero-tagline { font-family: 'Playfair Display', serif; font-style: italic; font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--cream); opacity: .92; margin-bottom: 18px; line-height: 1.4; }
    .hero-desc { font-size: 15px; color: var(--text-dim); line-height: 1.7; max-width: 520px; margin-bottom: 26px; }
    .hero-sub { padding: 44px 24px 0; text-align: center; }
    .hero-sub .hero-tagline, .hero-sub .hero-desc { margin: 0 auto 16px; max-width: 900px; text-align: center; }
    .hero-sub .hero-tagline { font-size: clamp(1.2rem, 2.6vw, 1.6rem); }
    .hero-sub .hero-desc { margin-bottom: 0; font-size: 16px; }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }

    section.block { padding: 72px 0; }
    .block-title { font-family: 'Playfair Display', serif; font-size: clamp(1.5rem, 3vw, 2.1rem); color: var(--cream); margin-bottom: 32px; }

    /* SYMPTOMS */
    .symptoms { background: var(--panel); }
    .symptoms .wrap { max-width: 1400px; }
    .symptoms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .symptoms-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .symptoms-item { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; color: var(--cream); line-height: 1.5; }
    .symptoms-item .dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--olive-light); margin-top: 7px; }
    .symptoms-photo { border-radius: 18px; overflow: hidden; aspect-ratio: 4/3; }
    .symptoms-photo--square { aspect-ratio: 1/1; }
    .symptoms-photo--wide { aspect-ratio: 16/9; }
    .symptoms-photo--tall { aspect-ratio: 3/4; }
    .symptoms-photo img { width: 100%; height: 100%; object-fit: cover; }
    .symptoms-quote { background: var(--olive); border-radius: 14px; padding: 20px 24px; font-size: 15px; color: var(--cream); font-weight: 600; line-height: 1.5; }

    /* BENEFITS */
    .benefits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 32px; }
    .benefits-grid--last { margin-bottom: 0; }
    .benefit-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
    .benefit-title { font-weight: 700; color: var(--cream); font-size: 15px; margin-bottom: 6px; }
    .benefit-text { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }

    /* STEPS */
    .steps-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 28px; position: relative; }
    .step { position: relative; }
    .step-num { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--olive-light); opacity: .55; margin-bottom: 10px; }
    .step-title { font-weight: 700; color: var(--cream); font-size: 15px; margin-bottom: 6px; }
    .step-text { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; }
    /* Фото кроку — необов'язкове (третя частина рядка в адмінці). */
    /* Розділ із кроками тримаємо компактнішим за решту блоків —
       з фото він і так високий. */
    section.block.steps-section { padding: 40px 0 44px; }
    .steps-section .block-title { margin-bottom: 22px; }
    .steps-row--photos { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .step-photo { border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 12px; background: var(--panel); }
    .step-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .step-photo--empty { background: none; }

    /* DETAIL / PRICING */
    .detail { background: var(--panel); }
    .detail-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; }
    .detail-eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 10px; }
    .detail-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin-bottom: 14px; }
    .detail-desc { font-size: 14.5px; color: var(--text-dim); line-height: 1.7; margin-bottom: 22px; }
    .suitable-title { font-weight: 700; color: var(--cream); margin-bottom: 14px; font-size: 15px; }
    .suitable-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
    .suitable-item { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--text-dim); line-height: 1.5; }
    .suitable-item .check { color: var(--olive-light); flex-shrink: 0; font-weight: 700; }
    .price-table { background: var(--black); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
    .price-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .price-row:last-child { border-bottom: none; }
    .price-dur { color: var(--cream); font-weight: 600; }
    .price-vals { display: flex; gap: 16px; color: var(--text-dim); font-size: 13px; }
    .price-vals b { color: var(--olive-light); }
    .detail-loc { font-size: 12.5px; color: var(--text-dim); margin-top: 14px; }

    /* ABONEMENTS */
    .abon-section { padding: 8px 24px 40px; }
    .abon-block { max-width: 1080px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 36px; }
    .abon-grid { display: grid; grid-template-columns: 290px 1fr; gap: 32px; align-items: center; }
    .abon-info-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; letter-spacing: .01em; text-transform: uppercase; color: var(--olive-light); font-weight: 700; margin-bottom: 10px; }
    .abon-info-sub { font-size: 14px; color: var(--text-dim); line-height: 1.5; margin-bottom: 18px; }
    .abon-info-box { border: 1px solid var(--line); border-radius: 16px; padding: 24px; min-width: 0; }
    .abon-price-col { border-right: 2px solid rgba(122,145,86,0.35); padding-right: 32px; }
    /* Послуга без абонементів — лишається сама колонка з ціною:
       без розділювача й на всю ширину картки. */
    .abon-block--price-only { max-width: 520px; }
    .abon-price-col--solo { border-right: none; padding-right: 0; }
    .abon-price-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--olive-light); font-weight: 700; margin-bottom: 10px; }
    .abon-price-big { font-family: 'Playfair Display', serif; font-size: 3.1rem; color: var(--cream); font-weight: 700; line-height: 1; margin-bottom: 18px; white-space: nowrap; }
    .abon-price-big span { font-size: 1.1rem; color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 400; }
    .abon-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .abon-card { position: relative; background: var(--black); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; }
    .abon-card--popular { border-color: var(--olive-light); }
    .abon-card-popular-label { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--olive-light); color: var(--black); padding: 3px 12px; border-radius: 20px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }
    .abon-badge { position: absolute; top: 16px; right: 16px; background: rgba(122,145,86,0.2); color: var(--olive-light); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
    .abon-card-title { font-size: 14px; color: var(--cream); margin-bottom: 12px; font-weight: 600; }
    .abon-card-price { font-family: 'Playfair Display', serif; font-size: 1.7rem; color: var(--cream); font-weight: 700; line-height: 1; }
    .abon-card-persession { font-size: 12px; color: var(--text-dim); margin: 6px 0 16px; }
    .abon-card-divider { border-top: 1px solid var(--line); margin-bottom: 12px; }
    .abon-card-total { font-size: 12.5px; color: var(--text-dim); }
    .abon-card-total b { color: var(--cream); }
    .abon-card-total del { opacity: .55; margin-left: 6px; }
    .abon-card--levels .abon-badge { top: 16px; }
    .abon-levels { display: flex; flex-direction: column; gap: 10px; }
    .abon-level-row { display: flex; flex-direction: column; gap: 3px; padding-top: 10px; border-top: 1px solid var(--line); }
    .abon-level-row:first-child { padding-top: 0; border-top: none; }
    .abon-level-name { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-dim); }
    .abon-level-total { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--cream); font-weight: 700; }
    .abon-level-total-label { font-weight: 400; }
    .abon-level-total del { font-family: 'Inter', sans-serif; font-weight: 400; font-size: .7em; opacity: .55; margin-left: 6px; }
    .abon-duration-switch-wrap, .abon-level-switch-wrap { display: flex; margin-bottom: 12px; }
    .abon-duration-switch, .abon-level-switch { display: inline-flex; gap: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 30px; padding: 4px; }
    .abon-duration-btn, .abon-level-btn { padding: 7px 16px; border-radius: 30px; font-size: 12.5px; color: var(--text-dim); background: none; border: none; cursor: pointer; font-family: inherit; transition: all .2s; }
    .abon-duration-btn.active, .abon-level-btn.active { background: var(--olive); color: var(--cream); }
    .abon-level-switch-wrap { margin-bottom: 16px; }
    @media (max-width: 780px) {
      .abon-grid { grid-template-columns: 1fr; text-align: center; }
      .abon-cards { grid-template-columns: 1fr; }
      .abon-price-col { border-right: none; padding-right: 0; padding-bottom: 24px; border-bottom: 2px solid rgba(122,145,86,0.35); margin-bottom: 24px; }
      .abon-duration-switch-wrap, .abon-level-switch-wrap { justify-content: center; }
    }

    .contacts-section { padding: 72px 24px; background: rgba(14,18,12,0.9); border-top: 1px solid var(--line); }
    .contacts-section .wrap { max-width: 1080px; margin: 0 auto; }
    .contacts-section .section-label { display: flex; align-items: center; gap: 10px; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 10px; }
    .contacts-section .section-label::before { content: ''; width: 24px; height: 1px; background: var(--olive-light); }
    .contacts-section .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 3.5vw, 3rem); line-height: 1.15; color: var(--cream); margin-bottom: 16px; }
    .contacts-grid { display: grid; grid-template-columns: 340px 1fr; gap: 48px; align-items: start; margin-top: 56px; }
    .contact-block { margin-bottom: 32px; }
    .contact-label { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--olive-light); margin-bottom: 8px; }
    .contact-value { font-size: 1.1rem; color: var(--cream); text-decoration: none; transition: color .25s; }
    a.contact-value:hover { color: var(--olive-light); }
    .social-row { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
    .social-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(46,61,34,0.4); border: 1px solid rgba(122,145,86,0.3); display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: all .3s; }
    .social-btn svg { width: 22px; height: 22px; }
    .social-btn--instagram { color: #e1306c !important; border-color: rgba(225,48,108,.3) !important; }
    .social-btn--instagram:hover { background: rgba(225,48,108,.12) !important; border-color: #e1306c !important; }
    .social-btn--tiktok { color: #fff !important; border-color: rgba(255,255,255,.3) !important; }
    .social-btn--tiktok:hover { background: rgba(255,255,255,.12) !important; border-color: #fff !important; }
    .social-btn--threads { color: #fff !important; border-color: rgba(255,255,255,.3) !important; }
    .social-btn--threads:hover { background: rgba(255,255,255,.12) !important; border-color: #fff !important; }
    .social-btn--whatsapp { color: #25d366 !important; border-color: rgba(37,211,102,.3) !important; }
    .social-btn--whatsapp:hover { background: rgba(37,211,102,.12) !important; border-color: #25d366 !important; }
    .social-btn--viber { color: #7360f2 !important; border-color: rgba(115,96,242,.3) !important; }
    .social-btn--viber:hover { background: rgba(115,96,242,.12) !important; border-color: #7360f2 !important; }
    .social-btn--telegram { color: #229ed9 !important; border-color: rgba(34,158,217,.3) !important; }
    .social-btn--telegram:hover { background: rgba(34,158,217,.12) !important; border-color: #229ed9 !important; }
    .social-btn--youtube { color: #ff0000 !important; border-color: rgba(255,0,0,.3) !important; }
    .social-btn--youtube:hover { background: rgba(255,0,0,.12) !important; border-color: #ff0000 !important; }
    /* Дві філії — дві окремі підписані карти поруч (зліва й справа). На
       вузьких екранах (медіазапит нижче) переносимо в стовпчик. */
    .map-embed-wrap { display: flex; flex-direction: row; gap: 20px; }
    .map-embed-item { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
    .map-embed-label { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--olive-light); }
    .map-open-link { font-size: 13px; color: var(--olive-light); text-decoration: none; text-align: center; }
    .map-open-link:hover { color: var(--cream); }
    .map-links { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; }
    @media (max-width: 780px) {
      .contacts-grid { grid-template-columns: 1fr; gap: 40px; }
    }
    @media (max-width: 480px) {
      .map-embed-wrap { flex-direction: column; }
    }

    /* FLOATING ACTIONS (запис + чат) — завжди по вертикальному центру справа */
    .floating-actions { position: fixed; top: 50%; right: 24px; transform: translateY(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 14px; }
    .book-fab { width: 60px; height: 60px; border-radius: 50%; background: var(--olive-light); color: var(--black); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(122,145,86,0.45); transition: transform .25s, background .25s; }
    .book-fab:hover { transform: translateY(-3px); background: #8FA864; }
    .book-fab svg { width: 26px; height: 26px; }
    .chat { position: relative; }
    .chat-launcher { position: relative; width: 60px; height: 60px; border-radius: 50%; background: var(--olive-light); color: var(--black); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(122,145,86,0.45); transition: transform .25s, background .25s; }
    .chat-launcher:hover { transform: translateY(-3px); background: #8FA864; }
    .chat-launcher__pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--olive-light); animation: chat-pulse 2.2s ease-out infinite; }
    @keyframes chat-pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.6); opacity: 0; } }
    .chat-panel { position: absolute; bottom: 0; right: 76px; width: 340px; max-width: calc(100vw - 32px); background: var(--black-2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.8); animation: chatIn .3s ease; }
    @keyframes chatIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .chat-head { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--olive); border-bottom: 1px solid var(--line); }
    .chat-head__ava { width: 40px; height: 40px; border-radius: 50%; background: var(--olive-light); color: var(--black); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 1.2rem; }
    .chat-head__meta { display: flex; flex-direction: column; flex: 1; }
    .chat-head__meta strong { color: var(--cream); font-size: 0.92rem; font-weight: 600; }
    .chat-head__meta span { color: rgba(242,237,228,0.7); font-size: 0.74rem; }
    .chat-close { color: var(--cream); font-size: 1.5rem; line-height: 1; width: 28px; height: 28px; background: none; border: none; cursor: pointer; }
    .chat-body { padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; max-height: 240px; overflow-y: auto; }
    .chat-msg { font-size: 0.86rem; line-height: 1.5; padding: 10px 14px; border-radius: 14px; max-width: 90%; }
    .chat-msg--in { background: rgba(46,61,34,0.4); border: 1px solid var(--line); color: var(--warm); align-self: flex-start; border-bottom-left-radius: 4px; }
    .chat-msg--out { background: var(--olive-light); color: var(--black); align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-msg__time { display: block; font-size: 0.64rem; opacity: 0.55; margin-top: 4px; text-align: right; }
    .chat-quick { padding: 0 16px 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chat-q { font-size: 0.78rem; padding: 8px 14px; border-radius: 50px; border: 1px solid var(--line); color: var(--cream); transition: all .25s; text-decoration: none; }
    .chat-q:hover { transform: translateY(-1px); }
    .chat-q--wa:hover { background: #25D366; border-color: #25D366; color: #042b14; }
    .chat-q--vb:hover { background: #7360f2; border-color: #7360f2; color: #fff; }
    .chat-q--tg:hover { background: #2AABEE; border-color: #2AABEE; color: #03283d; }
    .chat-q--ig:hover { background: #E1306C; border-color: #E1306C; color: #fff; }
    .chat-q--call:hover { background: var(--olive); border-color: var(--olive-light); }
    .chat-form { display: flex; gap: 8px; padding: 0 16px 16px; }
    .chat-form input { flex: 1; background: rgba(46,61,34,0.25); border: 1px solid var(--line); border-radius: 50px; padding: 10px 16px; color: var(--cream); font-size: 0.85rem; }
    .chat-form input::placeholder { color: var(--text-dim); }
    .chat-form button { width: 40px; height: 40px; border-radius: 50%; background: var(--olive-light); color: var(--black); font-size: 1.1rem; flex-shrink: 0; border: none; cursor: pointer; }
    @media (max-width: 780px) {
      /* На мобільному кнопки записи/дзвінка/чату тримались по вертикальному
         центру екрана — власник попросив прибити їх до нижнього правого
         кута замість центру. */
      .floating-actions { top: auto; bottom: 24px; right: 14px; transform: none; gap: 10px; }
      .book-fab, .chat-launcher { width: 52px; height: 52px; }
      /* На вузькому екрані панель не поміщається збоку від кнопки (вилазила
         за лівий край) — розкриваємо її НАД стовпчиком кнопок на всю ширину
         екрана з полями по 14px. */
      .chat-panel { right: 0; bottom: 72px; width: calc(100vw - 28px); max-width: none; }
      .chat-body { max-height: 180px; }
    }

    @media (max-width: 780px) {
      .symptoms-grid, .detail-grid { grid-template-columns: 1fr; }
      .symptoms-photo { order: -1; }
      .benefits-grid { grid-template-columns: 1fr; }
      .hero { min-height: 60vh; padding-top: 220px; }
      /* Мобільне кадрування фото не лишає темної ділянки під текстом —
         затемнюємо низ, де сидять заголовок і кнопки, градієнтом. */
      .hero-overlay { display: block; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(5,7,4,0.05) 0%, rgba(5,7,4,0.55) 45%, rgba(5,7,4,0.85) 100%); }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">
    <img src="/assets/img/logo.png" alt="Oliva" />
    <span>Oliva.</span>
  </a>
  <a href="/#services" class="nav-back">← До послуг</a>
</nav>

<div id="pageContent"><div class="loading">Завантаження…</div></div>

<script src="/assets/js/service-groups.js?v=4"></script>
<script>
(function () {
  var key = decodeURIComponent(location.pathname.split('/').pop() || '');
  var content = document.getElementById('pageContent');

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  /* Незамінний пробіл між числом і одиницею ("6000 грн"), щоб "грн" не
     переносилось саме по собі на новий рядок — решта тексту лишається
     звичайно переносною, тож рядок не розпирає колонку. */
  function nbspCur(s) { return s.replace(/ (?=\S+$)/, ' '); }
  function lines(s) { return String(s || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
  function pair(line) {
    var i = line.indexOf('::');
    if (i === -1) return { title: line.trim(), text: '' };
    return { title: line.slice(0, i).trim(), text: line.slice(i + 2).trim() };
  }
  /* Крок розділу «Як проходить…»: "Заголовок :: Опис :: /фото.jpg".
     Третя частина необов'язкова — якщо є, над кроком показуємо картинку.
     Окремо від pair(), бо той усе після першого "::" кладе в опис. */
  function stepParts(line) {
    var p = String(line == null ? '' : line).split('::').map(function(x){ return x.trim(); });
    return { title: p[0] || '', text: p[1] || '', photo: p[2] || '' };
  }
  function money(kop) { return Math.round((kop || 0) / 100) + ' грн'; }
  /* Рядок абонемента: "5 сеансів :: Разом :: Стара сума :: Бейдж :: рекомендовано"
     Обов'язкові лише перші дві частини; решта — необов'язкові. "Разом" і
     "Стара сума" можуть містити ціни для кількох рівнів майстра через кому:
     "Майстер 6000 грн, Топ Майстер 7000 грн, Експерт 8500 грн" — або просто
     одну суму без рівня, якщо в послуги рівнів немає. */
  function parseAbonLevels(raw, sessions) {
    if (!raw) return [];
    return raw.split(',').map(function(s){ return s.trim(); }).filter(Boolean).map(function(chunk){
      var lm = chunk.match(/^(Топ Майстер|Майстер|Експерт)\s+(.+)$/i);
      var level = lm ? lm[1] : '';
      var price = lm ? lm[2].trim() : chunk;
      var num = parseFloat(String(price).replace(/[^\d.,]/g, '').replace(',', '.'));
      var perSession = (sessions && num) ? Math.round(num / sessions) : null;
      return { level: level, price: price, perSession: perSession != null ? (perSession + ' грн') : '' };
    });
  }
  function parseAbon(line) {
    var parts = line.split('::').map(function(x){ return x.trim(); });
    var title = parts[0] || '';
    var m = title.match(/\d+/);
    var sessions = m ? parseInt(m[0], 10) : null;
    var totals = parseAbonLevels(parts[1] || '', sessions);
    var originals = parseAbonLevels(parts[2] || '', sessions);
    return {
      title: title, totals: totals, originals: originals, badge: parts[3] || '',
      popular: !!parts[4]
    };
  }
  /* Рядок-заголовок "[90 хв]" перемикає групу тривалості для наступних
     рядків абонементів — так можна задати різні ціни на той самий пакет
     сеансів залежно від тривалості послуги. Послуги без такого заголовка
     потрапляють в групу '' (тривалість не має значення, тумблер не показуємо). */
  function parseAbonemenItems(raw) {
    var groups = []; // [{duration, items:[]}]
    var current = null;
    lines(raw).forEach(function(line){
      var dm = line.match(/^\[(.+)\]$/);
      if (dm) {
        current = { duration: dm[1].trim(), items: [] };
        groups.push(current);
        return;
      }
      if (!current) { current = { duration: '', items: [] }; groups.push(current); }
      var a = parseAbon(line);
      if (a.title) current.items.push(a);
    });
    return groups.filter(function(g){ return g.items.length; });
  }
  var LEVEL_ORDER = ['Майстер', 'Топ Майстер', 'Експерт'];
  /* Рівні, за якими послуга РЕАЛЬНО поділена в прайсі (variants) — а не
     ті, що просто трапились у тексті абонементів. Власник міг завести
     абонементні пакети "Майстер/Топ Майстер/Експерт" для послуги, в якої
     в самому прайсі одна ціна на всіх (SPA-ритуали тощо) — тоді тумблер
     рівня лише плутає, бо на ціну він не впливає. Показуємо тумблер лише
     коли хоч один рядок послуги в базі справді має рівень у назві. */
  function collectRealLevels(vs) {
    var set = {};
    vs.forEach(function(v){ if (v.realLevel) set[v.realLevel] = true; });
    return LEVEL_ORDER.filter(function(l){ return set[l]; });
  }
  /* Текст уже виводиться курсивом/у визначеному стилі через CSS, тож зайві
     markdown-хвости, які власник іноді лишає при копіюванні (*текст*,
     екрановані крапки "\.") прибираємо, а не показуємо як є. */
  function clean(s) {
    s = String(s == null ? '' : s).trim();
    s = s.replace(/^\*+\s*/, '').replace(/\s*\*+$/, '');
    s = s.replace(/\\\./g, '.');
    return s;
  }

  Promise.all([
    fetch('/api/service-pages/' + encodeURIComponent(key)).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
    fetch('/api/services').then(function(r){ return r.json(); }).catch(function(){ return { services: [] }; }),
  ]).then(function (results) {
    var pageRes = results[0];
    var servicesRes = results[1];
    if (!pageRes || !pageRes.ok) {
      content.innerHTML = '<div class="loading">Сторінку не знайдено. <a href="/#services" style="color:var(--olive-light)">← До послуг</a></div>';
      return;
    }
    var p = pageRes.page;
    ['hero_tagline', 'hero_description', 'symptoms_quote', 'detail_description'].forEach(function (f) {
      if (p[f]) p[f] = clean(p[f]);
    });
    var SG = window.OlivaServiceGroups;
    var allServices = servicesRes.services || [];
    // Всі тарифні варіанти саме цієї послуги (за базовою назвою, без рівня й тривалості)
    var variants = allServices.filter(function (s) {
      return SG.parseName(s.name).cat === key;
    }).map(function (s) {
      var parsed = SG.parseName(s.name);
      return { level: parsed.level || 'Майстер', realLevel: parsed.level || null, dur: parsed.dur, price: s.price };
    }).filter(function (v) { return v.dur; }).sort(function (a, b) { return a.dur - b.dur; });

    var minPrice = variants.length ? Math.min.apply(null, variants.map(function(v){ return v.price; })) : null;
    var abonGroups = parseAbonemenItems(p.abonement_items);
    var abonLevels = collectRealLevels(variants);
    var activeLevel = abonLevels.length ? abonLevels[0] : null;
    var activeDurIdx = 0;
    /* "Ціна за візит" зверху блока абонементів має показувати РЕАЛЬНУ ціну
       з прайсу послуги (той самий рядок у "Послугах" в адмінці), а не
       розрахунок "разом / кількість сеансів" з абонемента — власник
       спеціально задає абонементні пакети з дисконтом, і та розрахункова
       цифра виходила іншою за фактичну ціну відвідування. Підбираємо
       варіант із variants за тривалістю поточної групи (якщо групу явно
       вказано, напр. "[90 хв]") і обраним рівнем. */
    function parseDurNum(s) { var m = String(s || '').match(/\d+/); return m ? parseInt(m[0], 10) : null; }
    function realPriceFor(groupIdx, level) {
      var durNum = parseDurNum((abonGroups[groupIdx] || {}).duration);
      var pool = variants;
      /* Абонементи інколи мають рівневі пакети (Майстер/Топ Майстер/Експерт)
         навіть для послуг, де в самому прайсі рівнів немає (одна ціна на
         всіх) — тоді фільтр за рівнем не знайшов би жодного варіанту.
         У такому разі не показуємо порожньо, а беремо ціну без урахування
         рівня — вона однакова для всіх, тож перемикач рівня просто не
         впливає на цифру. */
      if (level) {
        var byLevel = pool.filter(function(v){ return v.level === level; });
        if (byLevel.length) pool = byLevel;
      }
      if (durNum != null) {
        var exact = pool.filter(function(v){ return v.dur === durNum; });
        if (exact.length) pool = exact;
      }
      if (!pool.length) return null;
      return Math.round(Math.min.apply(null, pool.map(function(v){ return v.price; })) / 100);
    }
    var abonMinByGroup = abonGroups.map(function(g, i){ return realPriceFor(i, activeLevel); });

    var title = p.hero_title || key;
    document.title = title + ' — Студія масажу Oliva';
    var BASE = 'https://massage-oliva.com';
    var pageUrl = BASE + location.pathname;
    var ogImg = p.hero_photo ? (p.hero_photo.indexOf('http') === 0 ? p.hero_photo : BASE + p.hero_photo) : BASE + '/assets/img/og-image.jpg';
    document.querySelector('meta[name="description"]').content = p.hero_description || p.hero_tagline || title;
    document.querySelector('meta[property="og:title"]').content = title + ' — Студія масажу Oliva';
    document.querySelector('meta[property="og:description"]').content = p.hero_description || p.hero_tagline || title;
    document.querySelector('meta[property="og:url"]').content = pageUrl;
    document.querySelector('meta[property="og:image"]').content = ogImg;
    document.querySelector('link[rel="canonical"]').href = pageUrl;

    var html = '';

    // HERO
    var heroSizeCls = { compact: ' hero--compact', tall: ' hero--tall' }[p.hero_photo_size] || '';
    var heroInnerCls = p.hero_text_align === 'right' ? ' hero-inner--right' : '';
    html += '<section class="hero' + heroSizeCls + '">' +
      (p.hero_photo ? '<img class="hero-bg" src="' + esc(p.hero_photo) + '" alt="' + esc(title) + '">' : '<div class="hero-bg-fallback"></div>') +
      '<div class="hero-overlay"></div>' +
      '<div class="wrap"><div class="hero-inner' + heroInnerCls + '">' +
        '<div class="hero-eyebrow">Студія масажу Oliva · Київ</div>' +
        '<h1 class="hero-title">' + esc(title) + '</h1>' +
        '<div class="hero-btns">' +
          '<a href="/booking.html" class="btn btn-primary">Записатися онлайн →</a>' +
          '<a href="/certificate.html" class="btn btn-secondary">🎁 Подарувати сертифікат</a>' +
        '</div>' +
      '</div></div>' +
    '</section>';

    // Підзаголовок і опис — під фото шапки, щоб не перекривати об'єкт на фото
    if (p.hero_tagline || p.hero_description) {
      html += '<div class="hero-sub">' +
        (p.hero_tagline ? '<div class="hero-tagline">' + esc(p.hero_tagline) + '</div>' : '') +
        (p.hero_description ? '<p class="hero-desc">' + esc(p.hero_description) + '</p>' : '') +
      '</div>';
    }

    // АБОНЕМЕНТИ
    if (abonGroups.length) {
      var multiDur = abonGroups.length > 1;
      function renderAbonCards(items){
        return items.map(function(a){
          var single = a.totals.length <= 1 && !(a.totals[0] && a.totals[0].level);
          var body;
          if (single) {
            var t = a.totals[0];
            body =
              '<div class="abon-card-price">' + esc(t ? (t.perSession || t.price) : '') + '</div>' +
              (t && t.perSession ? '<div class="abon-card-persession">за сеанс</div>' : '') +
              '<div class="abon-card-divider"></div>' +
              '<div class="abon-card-total">Разом: <b>' + nbspCur(esc(t ? t.price : '')) + '</b>' + (a.originals[0] ? ' <del>' + nbspCur(esc(a.originals[0].price)) + '</del>' : '') + '</div>';
          } else {
            body = '<div class="abon-levels">' + a.totals.map(function(t, i){
              var orig = a.originals[i];
              return '<div class="abon-level-row"><span class="abon-level-name">' + esc(t.level || 'Разом') + '</span>' +
                '<span class="abon-level-total"><span class="abon-level-total-label">Разом: </span>' + nbspCur(esc(t.price)) + (orig ? ' <del>' + nbspCur(esc(orig.price)) + '</del>' : '') + '</span></div>';
            }).join('') + '</div>';
          }
          return '<div class="abon-card' + (a.popular ? ' abon-card--popular' : '') + (single ? '' : ' abon-card--levels') + '">' +
            (a.popular ? '<div class="abon-card-popular-label">Найпопулярніший</div>' : '') +
            (a.badge ? '<div class="abon-badge">' + esc(a.badge) + '</div>' : '') +
            '<div class="abon-card-title">' + esc(a.title) + '</div>' +
            body +
          '</div>';
        }).join('');
      }
      var abonHeaderPrice = abonMinByGroup[0] != null ? abonMinByGroup[0] : (minPrice != null ? Math.round(minPrice / 100) : null);
      html += '<div class="abon-section"><div class="abon-block">' +
        '<div class="abon-grid">' +
        '<div class="abon-price-col">' +
          (multiDur ? '<div class="abon-duration-switch-wrap"><div class="abon-duration-switch">' + abonGroups.map(function(g, i){
            return '<button type="button" class="abon-duration-btn' + (i === 0 ? ' active' : '') + '" data-abon-dur="' + i + '">' + esc(g.duration) + '</button>';
          }).join('') + '</div></div>' : '') +
          (abonLevels.length ? '<div class="abon-level-switch-wrap"><div class="abon-level-switch">' + abonLevels.map(function(lv, i){
            return '<button type="button" class="abon-level-btn' + (i === 0 ? ' active' : '') + '" data-abon-level="' + esc(lv) + '">' + esc(lv) + '</button>';
          }).join('') + '</div></div>' : '') +
          '<div class="abon-price-label">Ціна за візит</div>' +
          (abonHeaderPrice != null ? '<div class="abon-price-big" id="abonPriceBig"><span>від </span>' + abonHeaderPrice + ' грн</div>' : '') +
          '<a href="/booking.html" class="btn btn-primary" style="width:100%;justify-content:center;">Записатися →</a>' +
        '</div>' +
        '<div class="abon-info-box">' +
        '<div class="abon-info-title">Абонементи</div>' +
        '<div class="abon-info-sub">Більше турботи — вигідніше</div>' +
        abonGroups.map(function(g, i){
          return '<div class="abon-cards" data-abon-group="' + i + '"' + (i === 0 ? '' : ' style="display:none;"') + '>' + renderAbonCards(g.items) + '</div>';
        }).join('') +
        '</div>' +
        '</div>' +
      '</div></div>';
    } else if (minPrice != null) {
      /* Абонементів у послуги немає — але ціну показати треба: раніше вона
         дублювалась у шапці й у таблиці цін, обидва блоки прибрані, тож без
         цієї гілки сторінка лишалась зовсім без ціни (напр. «Антивіковий
         масаж обличчя»). Той самий блок, лише без правої колонки з картками. */
      html += '<div class="abon-section"><div class="abon-block abon-block--price-only">' +
        '<div class="abon-price-col abon-price-col--solo">' +
          '<div class="abon-price-label">Ціна за візит</div>' +
          '<div class="abon-price-big"><span>від </span>' + Math.round(minPrice / 100) + ' грн</div>' +
          '<a href="/booking.html" class="btn btn-primary" style="width:100%;justify-content:center;">Записатися →</a>' +
        '</div>' +
      '</div></div>';
    }

    // STEPS (перенесено вище, замість блока перків)
    var stepItems = lines(p.steps_items).map(stepParts).filter(function(x){ return x.title; });
    if (stepItems.length) {
      /* Якщо хоч в одного кроку є фото — вирівнюємо решту: кроки без
         картинки отримують порожнє місце тієї ж висоти, щоб заголовки
         й номери стояли в один рядок, а не «стрибали». */
      var anyStepPhoto = stepItems.some(function(s){ return s.photo; });
      html += '<section class="block symptoms steps-section"><div class="wrap">' +
        '<h2 class="block-title">' + esc(p.steps_title || 'Як проходить ваш сеанс') + '</h2>' +
        '<div class="steps-row' + (anyStepPhoto ? ' steps-row--photos' : '') + '">' + stepItems.map(function(s, i){
          return '<div class="step">' +
            (anyStepPhoto ? '<div class="step-photo' + (s.photo ? '' : ' step-photo--empty') + '">' +
              (s.photo ? '<img src="' + esc(s.photo) + '" alt="' + esc(s.title) + '" loading="lazy">' : '') +
            '</div>' : '') +
            '<div class="step-num">0' + (i+1) + '</div>' +
            '<div class="step-title">' + esc(s.title) + '</div>' +
            (s.text ? '<div class="step-text">' + esc(s.text) + '</div>' : '') +
          '</div>';
        }).join('') + '</div>' +
      '</div></section>';
    }

    // SYMPTOMS
    var symptomItems = lines(p.symptoms_items);
    if (symptomItems.length) {
