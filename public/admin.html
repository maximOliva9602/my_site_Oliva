<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Oliva — Адмін-чат</title>
<link rel="icon" href="assets/img/logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #080A07; --black-2: #0e120c; --panel: #12160e;
    --olive: #2E3D22; --olive-mid: #4A5E35; --olive-light: #7A9156;
    --cream: #F2EDE4; --text: #D4CFC6; --text-dim: #8A8880;
    --line: rgba(122,145,86,0.18);
  }
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--text); overflow: hidden; }
  .pf { font-family: 'Playfair Display', serif; }

  /* ----- LOGIN ----- */
  .login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px; text-align: center; }
  .login-logo { width: 64px; height: 64px; object-fit: contain; margin: 0 auto 14px; display: block; }
  .login-card h1 { font-size: 1.4rem; color: var(--cream); margin-bottom: 4px; }
  .login-card p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 22px; }
  .login-card input { width: 100%; background: rgba(46,61,34,0.25); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--cream); font-size: 0.95rem; margin-bottom: 12px; }
  .login-card button { width: 100%; background: var(--olive-light); color: var(--black); border: none; border-radius: 10px; padding: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background .25s; }
  .login-card button:hover { background: #8FA864; }
  .login-err { color: #e0816b; font-size: 0.82rem; margin-top: 10px; min-height: 18px; }

  /* ----- APP ----- */
  .app { display: none; height: 100%; grid-template-columns: 320px 1fr; }
  .app.on { display: grid; }

  /* sidebar */
  .side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .side-head img { width: 32px; height: 32px; object-fit: contain; }
  .side-head .pf { font-size: 1.1rem; color: var(--cream); }
  .side-head .status { margin-left: auto; font-size: 0.72rem; color: var(--olive-light); display: flex; align-items: center; gap: 6px; }
  .dot-on { width: 8px; height: 8px; border-radius: 50%; background: var(--olive-light); box-shadow: 0 0 0 0 rgba(122,145,86,.6); animation: blink 2s infinite; }
  @keyframes blink { 0% { box-shadow: 0 0 0 0 rgba(122,145,86,.5);} 100% { box-shadow: 0 0 0 8px rgba(122,145,86,0);} }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv { padding: 14px 18px; border-bottom: 1px solid rgba(122,145,86,0.08); cursor: pointer; display: flex; gap: 12px; align-items: center; transition: background .2s; }
  .conv:hover { background: rgba(46,61,34,0.2); }
  .conv.active { background: rgba(46,61,34,0.35); }
  .conv-ava { width: 40px; height: 40px; border-radius: 50%; background: var(--olive); color: var(--cream); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; flex-shrink: 0; }
  .conv-main { flex: 1; min-width: 0; }
  .conv-name { font-size: 0.9rem; color: var(--cream); font-weight: 500; }
  .conv-last { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-badge { background: var(--olive-light); color: var(--black); font-size: 0.7rem; font-weight: 600; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .conv-empty { padding: 30px 18px; color: var(--text-dim); font-size: 0.85rem; text-align: center; }
  .side-foot { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .side-foot button { background: none; border: 1px solid var(--line); color: var(--text-dim); border-radius: 8px; padding: 8px 12px; font-size: 0.78rem; cursor: pointer; width: 100%; transition: all .2s; }
  .side-foot button:hover { color: var(--cream); border-color: var(--olive-light); }
  .side-foot .blog-btn { background: rgba(122,145,86,0.12); border-color: rgba(122,145,86,0.35); color: var(--olive-light); }
  .side-foot .blog-btn:hover { background: rgba(122,145,86,0.2); color: var(--cream); }

  /* ----- BLOG MANAGER ----- */
  .blog-overlay { display: none; position: fixed; inset: 0; background: var(--black); z-index: 200; flex-direction: column; overflow: hidden; }
  .blog-overlay.open { display: flex; }
  .blog-top { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .blog-top h2 { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 1.1rem; flex: 1; }
  .blog-top button { background: none; border: 1px solid var(--line); color: var(--text-dim); border-radius: 8px; padding: 7px 14px; font-size: 0.8rem; cursor: pointer; transition: all .2s; }
  .blog-top button:hover { color: var(--cream); border-color: var(--olive-light); }
  .blog-top .btn-new { background: var(--olive-light); color: var(--black); border-color: transparent; font-weight: 600; }
  .blog-top .btn-new:hover { background: #8fa864; }

  .blog-body { flex: 1; overflow-y: auto; padding: 24px; }
  .blog-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .blog-card { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .blog-card-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: rgba(255,255,255,0.05); }
  .blog-card-body { padding: 14px; }
  .blog-card-status { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  .blog-card-status.pub { color: var(--olive-light); }
  .blog-card-status.draft { color: var(--text-dim); }
  .blog-card-title { font-size: 0.9rem; color: var(--cream); font-weight: 500; margin-bottom: 4px; }
  .blog-card-date { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; }
  .blog-card-actions { display: flex; gap: 8px; }
  .blog-card-actions button { flex: 1; padding: 6px; font-size: 12px; border-radius: 8px; background: none; border: 1px solid var(--line); color: var(--text-dim); cursor: pointer; transition: all .2s; }
  .blog-card-actions button:hover { color: var(--cream); border-color: var(--olive-light); }
  .blog-card-actions .btn-del:hover { border-color: #e07070; color: #e07070; }

  /* Editor */
  .blog-editor { display: none; flex-direction: column; gap: 18px; max-width: 860px; }
  .blog-editor.open { display: flex; }
  .blog-editor label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 6px; display: block; }
  .blog-editor input[type=text] { width: 100%; background: rgba(46,61,34,0.2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--cream); font-family: 'Inter', sans-serif; font-size: 15px; }
  .blog-editor input[type=text]:focus { outline: none; border-color: var(--olive-light); }
  .blog-editor input[type=text]::placeholder { color: rgba(242,237,228,0.2); }

  /* Cover upload */
  .cover-upload-btn { display: flex; align-items: center; gap: 12px; }
  .cover-upload-btn button { background: rgba(122,145,86,0.15); border: 1px dashed rgba(122,145,86,0.4); color: var(--olive-light); border-radius: 10px; padding: 10px 18px; font-size: 13px; cursor: pointer; transition: all .2s; }
  .cover-upload-btn button:hover { background: rgba(122,145,86,0.25); border-style: solid; color: var(--cream); }
  .cover-thumb { width: 80px; height: 54px; object-fit: cover; border-radius: 8px; display: none; }
  .cover-thumb.show { display: block; }
  .cover-name { font-size: 12px; color: var(--text-dim); }

  /* WYSIWYG toolbar */
  .editor-toolbar { display: flex; gap: 4px; flex-wrap: wrap; background: rgba(46,61,34,0.25); border: 1px solid var(--line); border-bottom: none; border-radius: 10px 10px 0 0; padding: 8px 10px; }
  .tb-btn { background: none; border: none; color: var(--text-dim); border-radius: 6px; width: 34px; height: 30px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .tb-btn:hover { background: rgba(122,145,86,0.2); color: var(--cream); }
  .tb-btn.active { background: rgba(122,145,86,0.3); color: var(--cream); }
  .tb-sep { width: 1px; background: var(--line); margin: 4px 4px; align-self: stretch; }
  .tb-btn-img { width: auto; padding: 0 10px; font-size: 12px; gap: 4px; }
  .editor-area { min-height: 260px; background: rgba(46,61,34,0.15); border: 1px solid var(--line); border-radius: 0 0 10px 10px; padding: 16px; color: var(--cream); font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.75; outline: none; }
  .editor-area:focus { border-color: var(--olive-light); }
  .editor-area p { margin-bottom: 12px; }
  .editor-area h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--cream); margin: 20px 0 10px; }
  .editor-area ul, .editor-area ol { padding-left: 20px; margin-bottom: 12px; }
  .editor-area li { margin-bottom: 6px; }
  .editor-area img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
  .editor-area a { color: var(--olive-light); }
  .editor-area [data-placeholder]:empty::before { content: attr(data-placeholder); color: rgba(242,237,228,0.2); pointer-events: none; }

  .blog-editor .publish-row { display: flex; align-items: center; gap: 10px; }
  .blog-editor .publish-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--olive-light); }
  .blog-editor .publish-row span { font-size: 14px; color: var(--cream); }
  .editor-actions { display: flex; gap: 10px; }
  .editor-actions button { padding: 12px 24px; border-radius: 10px; font-size: 14px; cursor: pointer; transition: all .2s; }
  .btn-save { background: var(--olive-light); border: none; color: #000; font-weight: 600; }
  .btn-save:hover { background: #8fa864; }
  .btn-cancel-ed { background: none; border: 1px solid var(--line); color: var(--text-dim); }
  .btn-cancel-ed:hover { color: var(--cream); border-color: var(--olive-light); }
  .upload-input { display: none; }

  /* chat pane */
  .pane { display: flex; flex-direction: column; min-height: 0; background: var(--black); }
  .pane-head { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .pane-head .back { display: none; background: none; border: none; color: var(--cream); font-size: 1.3rem; cursor: pointer; }
  .pane-head .pf { font-size: 1.05rem; color: var(--cream); }
  .pane-sub { font-size: 0.72rem; color: var(--text-dim); }
  .msgs { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70%; font-size: 0.9rem; line-height: 1.5; padding: 10px 14px; border-radius: 14px; }
  .msg time { display: block; font-size: 0.64rem; opacity: 0.55; margin-top: 4px; }
  .msg.in { background: rgba(46,61,34,0.4); border: 1px solid var(--line); color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.out { background: var(--olive-light); color: var(--black); align-self: flex-end; border-bottom-right-radius: 4px; }
  .pane-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 0.9rem; text-align: center; padding: 20px; }
  .composer { display: flex; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--line); }
  .composer input { flex: 1; background: rgba(46,61,34,0.25); border: 1px solid var(--line); border-radius: 50px; padding: 12px 18px; color: var(--cream); font-size: 0.9rem; }
  .composer input::placeholder { color: var(--text-dim); }
  .composer button { width: 46px; height: 46px; border-radius: 50%; background: var(--olive-light); color: var(--black); border: none; font-size: 1.2rem; cursor: pointer; flex-shrink: 0; }
  .composer[hidden] { display: none; }

  @media (max-width: 760px) {
    .app.on { grid-template-columns: 1fr; }
    .side { display: flex; }
    .app.viewing .side { display: none; }
    .pane { display: none; }
    .app.viewing .pane { display: flex; }
    .pane-head .back { display: block; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <img src="assets/img/logo.png" alt="Oliva" class="login-logo" />
    <h1 class="pf">Oliva — Адмін</h1>
    <p>Вхід для менеджера</p>
    <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password" required />
    <button type="submit">Увійти</button>
    <div class="login-err" id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <img src="assets/img/logo.png" alt="" />
      <span class="pf">Діалоги</span>
      <span class="status"><span class="dot-on"></span>онлайн</span>
    </div>
    <div class="conv-list" id="convList">
      <div class="conv-empty" id="convEmpty">Поки немає звернень.<br>Тут зʼявлятимуться чати з сайту.</div>
    </div>
    <div class="side-foot">
      <button class="blog-btn" id="blogMgrBtn">✍️ Керувати блогом</button>
      <button id="logoutBtn">Вийти</button>
    </div>
  </aside>

  <!-- BLOG MANAGER OVERLAY -->
  <div class="blog-overlay" id="blogOverlay">
    <div class="blog-top">
      <h2>✍️ Блог</h2>
      <button id="blogNewBtn" class="btn-new">+ Нова стаття</button>
      <button id="blogCloseBtn">✕ Закрити</button>
    </div>
    <div class="blog-body" id="blogBody">
      <!-- Editor -->
      <div class="blog-editor" id="blogEditor">
        <div>
          <label>Заголовок *</label>
          <input type="text" id="edTitle" placeholder="Наприклад: 5 переваг масажу після спорту" />
        </div>
        <div>
          <label>Короткий анонс (показується в списку статей)</label>
          <input type="text" id="edExcerpt" placeholder="2-3 речення про статтю..." />
        </div>
        <div>
          <label>Обкладинка (головне фото)</label>
          <div class="cover-upload-btn">
            <button type="button" id="uploadCoverBtn">📷 Завантажити фото</button>
            <img id="edCoverPreview" class="cover-thumb" src="" alt="cover" />
            <span class="cover-name" id="coverName"></span>
          </div>
          <input type="file" id="uploadInput" class="upload-input" accept="image/*" />
          <input type="hidden" id="edCover" />
        </div>
        <div>
          <label>Текст статті</label>
          <div class="editor-toolbar" id="editorToolbar">
            <button type="button" class="tb-btn" data-cmd="bold" title="Жирний"><b>B</b></button>
            <button type="button" class="tb-btn" data-cmd="italic" title="Курсив"><i>I</i></button>
            <button type="button" class="tb-btn" data-cmd="underline" title="Підкреслений"><u>U</u></button>
            <div class="tb-sep"></div>
            <button type="button" class="tb-btn" data-cmd="h2" title="Підзаголовок">H2</button>
            <button type="button" class="tb-btn" data-cmd="p" title="Звичайний текст">¶</button>
            <div class="tb-sep"></div>
            <button type="button" class="tb-btn" data-cmd="insertUnorderedList" title="Список">≡</button>
            <button type="button" class="tb-btn" data-cmd="insertOrderedList" title="Нумерований список">1.</button>
            <div class="tb-sep"></div>
            <button type="button" class="tb-btn tb-btn-img" id="insertImgBtn" title="Вставити фото">🖼 Фото</button>
            <input type="file" id="insertImgInput" class="upload-input" accept="image/*" />
          </div>
          <div class="editor-area" id="edBody" contenteditable="true" data-placeholder="Пишіть тут — просто текст, без жодного коду..."></div>
        </div>
        <div class="publish-row">
          <input type="checkbox" id="edPublished" />
          <span>Опублікувати (буде видно на сайті)</span>
        </div>
        <div class="editor-actions">
          <button class="btn-save" id="edSaveBtn">💾 Зберегти</button>
          <button class="btn-cancel-ed" id="edCancelBtn">Скасувати</button>
        </div>
      </div>
      <!-- List -->
      <div class="blog-list" id="blogList"></div>
    </div>
  </div>

  <section class="pane" id="pane">
    <div class="pane-empty" id="paneEmpty">← Оберіть діалог зі списку</div>

    <div id="paneChat" style="display:none; flex-direction:column; min-height:0; flex:1;">
      <div class="pane-head">
        <button class="back" id="backBtn">←</button>
        <div>
          <div class="pf" id="paneName">Гість</div>
          <div class="pane-sub" id="paneSub"></div>
        </div>
      </div>
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="composer">
        <input type="text" id="replyInput" placeholder="Відповідь клієнту…" autocomplete="off" />
        <button type="submit" aria-label="Надіслати">→</button>
      </form>
    </div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  "use strict";
  var loginEl = document.getElementById("login");
  var loginForm = document.getElementById("loginForm");
  var loginErr = document.getElementById("loginErr");
  var appEl = document.getElementById("app");
  var convList = document.getElementById("convList");
  var convEmpty = document.getElementById("convEmpty");
  var paneEmpty = document.getElementById("paneEmpty");
  var paneChat = document.getElementById("paneChat");
  var paneName = document.getElementById("paneName");
  var paneSub = document.getElementById("paneSub");
  var msgs = document.getElementById("msgs");
  var composer = document.getElementById("composer");
  var replyInput = document.getElementById("replyInput");

  var socket = null;
  var current = null;       // visitorId відкритого діалогу
  var convMap = {};         // id -> conv summary

  function timeLabel(ts) {
    var d = new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  }
  function initials(name) { return (name || "Г").trim().charAt(0).toUpperCase(); }

  /* ----- авторизація ----- */
  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    loginErr.textContent = "";
    var password = document.getElementById("pass").value;
    fetch("/api/admin/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok) start();
        else loginErr.textContent = "Невірний пароль";
      }).catch(function () { loginErr.textContent = "Помилка зʼєднання"; });
  });

  // якщо вже авторизовані (cookie) — одразу в застосунок
  fetch("/api/admin/me").then(function (r) { return r.json(); }).then(function (j) { if (j.ok) start(); });

  /* ----- застосунок ----- */
  function start() {
    loginEl.style.display = "none";
    appEl.classList.add("on");
    if (socket) return;
    socket = io({ auth: { role: "admin" } });

    socket.on("unauthorized", function () { location.reload(); });
    socket.on("conversations", renderConvs);
    socket.on("visitor:msg", function (d) {
      if (current === d.visitorId) appendMsg(d.message);
    });
    socket.on("admin:reply", function (d) {
      if (current === d.visitorId) appendMsg(d.message);
    });
    socket.on("history", function (d) {
      current = d.id;
      paneName.textContent = d.name || "Гість";
      paneSub.textContent = "ID: " + d.id;
      msgs.innerHTML = "";
      (d.messages || []).forEach(appendMsg);
      paneEmpty.style.display = "none";
      paneChat.style.display = "flex";
      appEl.classList.add("viewing");
      highlightActive();
    });
  }

  function renderConvs(list) {
    convMap = {};
    list.forEach(function (c) { convMap[c.id] = c; });
    convList.querySelectorAll(".conv").forEach(function (n) { n.remove(); });
    convEmpty.style.display = list.length ? "none" : "block";
    list.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "conv" + (c.id === current ? " active" : "");
      row.setAttribute("data-id", c.id);
      var prefix = c.lastFrom === "admin" ? "Ви: " : "";
      row.innerHTML =
        '<div class="conv-ava"></div>' +
        '<div class="conv-main">' +
          '<div class="conv-name"></div>' +
          '<div class="conv-last"></div>' +
        '</div>';
      row.querySelector(".conv-ava").textContent = initials(c.name);
      row.querySelector(".conv-name").textContent = c.name || "Гість";
      row.querySelector(".conv-last").textContent = prefix + (c.last || "");
      if (c.unread > 0 && c.id !== current) {
        var b = document.createElement("div"); b.className = "conv-badge"; b.textContent = c.unread;
        row.appendChild(b);
      }
      row.addEventListener("click", function () { openConv(c.id); });
      convList.appendChild(row);
    });
  }

  function openConv(id) { current = id; socket.emit("open", id); }

  function appendMsg(m) {
    var el = document.createElement("div");
    el.className = "msg " + (m.from === "admin" ? "out" : "in");
    el.textContent = m.text;
    var t = document.createElement("time"); t.textContent = timeLabel(m.ts);
    el.appendChild(t);
    msgs.appendChild(el);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function highlightActive() {
    convList.querySelectorAll(".conv").forEach(function (n) {
      n.classList.toggle("active", n.getAttribute("data-id") === current);
      if (n.getAttribute("data-id") === current) { var b = n.querySelector(".conv-badge"); if (b) b.remove(); }
    });
  }

  composer.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = replyInput.value.trim();
    if (!text || !current) return;
    socket.emit("reply", { visitorId: current, text: text });
    replyInput.value = ""; replyInput.focus();
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    appEl.classList.remove("viewing");
  });
  document.getElementById("logoutBtn").addEventListener("click", function () {
    fetch("/api/admin/logout", { method: "POST" }).then(function () { location.reload(); });
  });

  /* ========== BLOG MANAGER ========== */
  var blogOverlay    = document.getElementById("blogOverlay");
  var blogEditor     = document.getElementById("blogEditor");
  var blogList       = document.getElementById("blogList");
  var edTitle        = document.getElementById("edTitle");
  var edExcerpt      = document.getElementById("edExcerpt");
  var edBody         = document.getElementById("edBody");
  var edCover        = document.getElementById("edCover");
  var edPublished    = document.getElementById("edPublished");
  var edCoverPreview = document.getElementById("edCoverPreview");
  var coverName      = document.getElementById("coverName");
  var editingId      = null;

  document.getElementById("blogMgrBtn").addEventListener("click", function () {
    blogOverlay.classList.add("open");
    loadPosts();
  });
  document.getElementById("blogCloseBtn").addEventListener("click", function () {
    blogOverlay.classList.remove("open");
    closeEditor();
  });
  document.getElementById("blogNewBtn").addEventListener("click", function () { openEditor(null); });
  document.getElementById("edCancelBtn").addEventListener("click", closeEditor);

  /* -- Завантаження обкладинки -- */
  document.getElementById("uploadCoverBtn").addEventListener("click", function () {
    document.getElementById("uploadInput").click();
  });
  document.getElementById("uploadInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;
    uploadImage(file, function(url) {
      edCover.value = url;
      edCoverPreview.src = url;
      edCoverPreview.classList.add("show");
      coverName.textContent = file.name;
    });
    this.value = '';
  });

  /* -- Вставка фото в текст -- */
  document.getElementById("insertImgBtn").addEventListener("click", function () {
    document.getElementById("insertImgInput").click();
  });
  document.getElementById("insertImgInput").addEventListener("change", function () {
    var file = this.files[0];
    if (!file) return;
    uploadImage(file, function(url) {
      edBody.focus();
      document.execCommand("insertHTML", false, '<img src="' + url + '" style="max-width:100%;border-radius:8px;margin:10px 0" />');
    });
    this.value = '';
  });

  /* -- Завантаження файлу → стиснення canvas → base64 → сервер -- */
  function uploadImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        /* стискаємо до max 1600px по довшій стороні, JPEG 85% */
        var MAX = 1600;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
          else        { w = Math.round(w * MAX / h); h = MAX; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        fetch("/api/admin/upload-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ dataUrl: dataUrl, ext: 'jpg' })
        }).then(function(r){ return r.json(); }).then(function(j){
          if (j.ok) cb(j.url);
          else alert('Помилка завантаження фото');
        }).catch(function(){ alert('Помилка мережі'); });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* -- Toolbar -- */
  document.getElementById("editorToolbar").addEventListener("click", function(e) {
    var btn = e.target.closest("[data-cmd]");
    if (!btn) return;
    var cmd = btn.getAttribute("data-cmd");
    edBody.focus();
    if (cmd === "h2") {
      document.execCommand("formatBlock", false, "H2");
    } else if (cmd === "p") {
      document.execCommand("formatBlock", false, "P");
    } else {
      document.execCommand(cmd, false, null);
    }
    e.preventDefault();
  });

  /* -- Список статей -- */
  function loadPosts() {
    fetch("/api/admin/posts").then(function(r){ return r.json(); }).then(function(posts){
      blogList.innerHTML = "";
      if (!posts.length) {
        blogList.innerHTML = '<div style="color:var(--text-dim);padding:32px;text-align:center;grid-column:1/-1">Поки немає статей. Натисніть "+ Нова стаття"</div>';
        return;
      }
      posts.forEach(function(p){
        var card = document.createElement("div");
        card.className = "blog-card";
        var cover = p.cover ? '<img class="blog-card-cover" src="' + p.cover + '" />' : '<div class="blog-card-cover" style="display:flex;align-items:center;justify-content:center;font-size:2rem">🌿</div>';
        card.innerHTML = cover +
          '<div class="blog-card-body">' +
            '<div class="blog-card-status ' + (p.published ? 'pub' : 'draft') + '">' + (p.published ? '● Опублікована' : '○ Чернетка') + '</div>' +
            '<div class="blog-card-title">' + p.title + '</div>' +
            '<div class="blog-card-date">' + (p.date || '') + '</div>' +
            '<div class="blog-card-actions">' +
              '<button data-edit>✏️ Редагувати</button>' +
              (p.published
                ? '<button data-toggle>⬇ Сховати</button>'
                : '<button data-toggle>✅ Опублікувати</button>') +
              '<button class="btn-del" data-del>🗑</button>' +
            '</div>' +
          '</div>';
        card.querySelector('[data-edit]').addEventListener('click', function(){ openEditor(p); });
        card.querySelector('[data-toggle]').addEventListener('click', function(){ togglePublish(p.id, !p.published); });
        card.querySelector('[data-del]').addEventListener('click', function(){
          if (confirm('Видалити статтю "' + p.title + '"?')) deletePost(p.id);
        });
        blogList.appendChild(card);
      });
    });
  }

  function openEditor(post) {
    editingId = post ? post.id : null;
    edTitle.value       = post ? post.title : '';
    edExcerpt.value     = post ? (post.excerpt || '') : '';
    edBody.innerHTML    = post ? (post.body || '') : '';
    edCover.value       = post ? (post.cover || '') : '';
    edPublished.checked = post ? !!post.published : false;
    if (post && post.cover) {
      edCoverPreview.src = post.cover;
      edCoverPreview.classList.add("show");
      coverName.textContent = '';
    } else {
      edCoverPreview.classList.remove("show");
      coverName.textContent = '';
    }
    blogList.style.display = 'none';
    document.getElementById("blogNewBtn").style.display = 'none';
    blogEditor.classList.add('open');
    edTitle.focus();
  }

  function closeEditor() {
    blogEditor.classList.remove('open');
    blogList.style.display = '';
    document.getElementById("blogNewBtn").style.display = '';
  }

  document.getElementById("edSaveBtn").addEventListener("click", function () {
    var title = edTitle.value.trim();
    if (!title) { edTitle.focus(); edTitle.style.borderColor='#e07070'; return; }
    edTitle.style.borderColor = '';
    var data = {
      title: title,
      excerpt: edExcerpt.value.trim(),
      body: edBody.innerHTML,
      cover: edCover.value.trim(),
      published: edPublished.checked
    };
    var url    = editingId ? '/api/admin/posts/' + editingId : '/api/admin/posts';
    var method = editingId ? 'PUT' : 'POST';
    var btn = this;
    btn.textContent = 'Збереження...';
    btn.disabled = true;
    fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        btn.textContent = '💾 Зберегти'; btn.disabled = false;
        if (j.ok) { closeEditor(); loadPosts(); }
        else alert('Помилка збереження');
      }).catch(function(){ btn.textContent = '💾 Зберегти'; btn.disabled = false; });
  });

  function togglePublish(id, published) {
    fetch('/api/admin/posts/' + id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ published: published })
    }).then(loadPosts);
  }
  function deletePost(id) {
    fetch('/api/admin/posts/' + id, { method: 'DELETE' }).then(loadPosts);
  }
  /* ========== END BLOG ========== */

})();
</script>
</body>
</html>
