<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>Oliva — Розклад майстра</title>
  <link rel="manifest" href="/manifest-master.json"/>
  <meta name="theme-color" content="#7A9156"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Oliva"/>
  <link rel="apple-touch-icon" href="/assets/img/logo.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --black: #111710;
      --panel: #1a2310;
      --olive: #2E3D22;
      --olive-mid: #4A5E35;
      --olive-light: #7A9156;
      --cream: #F2EDE4;
      --text-dim: rgba(242,237,228,0.45);
      --line: rgba(122,145,86,0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--cream); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* ── PUSH TOAST ── */
    #push-toast {
      position: fixed; left: 16px; right: 16px; bottom: 20px; z-index: 999;
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
      animation: pushToastIn .3s cubic-bezier(.4,0,.2,1);
    }
    @keyframes pushToastIn { from { transform: translateY(80px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
    #push-toast .pt-msg { font-size: .9rem; color: var(--cream); line-height: 1.4; }
    #push-toast .pt-btns { display: flex; gap: 8px; }
    #push-toast .pt-btn {
      flex: 1; border: 1px solid var(--line); background: transparent; color: var(--cream);
      border-radius: 10px; padding: 10px; font-size: .85rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    #push-toast .pt-btn-primary { background: var(--olive-light); color: #000; border-color: var(--olive-light); }
    #push-toast .pt-btn:active { opacity: .8; }

    /* ── LOGIN ── */
    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 36px 28px; text-align: center; }
    .login-logo { width: 64px; height: 64px; object-fit: contain; margin: 0 auto 16px; display: block; border-radius: 50%; }
    .login-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--cream); margin-bottom: 6px; }
    .login-sub { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 28px; }
    .login-card input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 10px; padding: 13px 16px; color: var(--cream); font-size: 1rem; outline: none; transition: border-color .2s; margin-bottom: 14px; }
    .login-card input:focus { border-color: var(--olive-light); }
    .login-card button { width: 100%; background: var(--olive-light); color: #000; border: none; border-radius: 10px; padding: 13px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity .2s; }
    .login-card button:active { opacity: .8; }
    .login-err { color: #e0816b; font-size: 0.8rem; margin-top: 10px; min-height: 18px; }

    /* ── MASTER SELECT ── */
    .master-select { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 6px; }
    .page-sub { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 24px; }
    .master-list { display: flex; flex-direction: column; gap: 12px; }
    .master-btn { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: border-color .2s, background .2s; }
    .master-btn:active { background: rgba(122,145,86,0.1); border-color: var(--olive-light); }
    .master-ava { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--olive); flex-shrink: 0; }
    .master-ava-ph { width: 48px; height: 48px; border-radius: 50%; background: var(--olive-mid); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--cream); flex-shrink: 0; }
    .master-info { text-align: left; }
    .master-name { font-size: 0.95rem; font-weight: 500; color: var(--cream); }
    .master-level { font-size: 0.78rem; color: var(--text-dim); margin-top: 2px; }
    .master-arrow { margin-left: auto; color: var(--text-dim); font-size: 1.1rem; }

    /* ── SCHEDULE ── */
    .schedule-wrap { max-width: 480px; margin: 0 auto; }
    .sched-header { display: flex; align-items: center; gap: 12px; padding: 16px 16px 0; }
    .btn-back { background: none; border: none; color: var(--olive-light); font-size: 1.4rem; cursor: pointer; padding: 4px; line-height: 1; }
    .sched-master-info { display: flex; align-items: center; gap: 10px; flex: 1; }
    .sched-ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--olive-mid); }
    .sched-ava-ph { width: 40px; height: 40px; border-radius: 50%; background: var(--olive-mid); display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--cream); }
    .sched-name { font-size: 0.95rem; font-weight: 500; }
    .sched-level { font-size: 0.75rem; color: var(--text-dim); }

    /* Tabs days */
    .days-tabs { display: flex; gap: 8px; padding: 16px 16px 0; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
    .days-tabs::-webkit-scrollbar { display: none; }
    .day-tab { flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; text-align: center; cursor: pointer; transition: all .2s; min-width: 58px; }
    .day-tab.active { background: var(--olive-light); border-color: var(--olive-light); color: #000; }
    .day-tab-dow { font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: inherit; }
    .day-tab-num { font-size: 1.1rem; font-weight: 600; margin-top: 2px; }
    .day-tab-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--olive-light); margin: 4px auto 0; }
    .day-tab.active .day-tab-dot { background: rgba(0,0,0,0.4); }

    /* Appointments */
    .appts-wrap { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .appt-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; }
    .appt-time-col { display: flex; flex-direction: column; align-items: center; min-width: 46px; }
    .appt-time { font-size: 1rem; font-weight: 600; color: var(--olive-light); }
    .appt-dur { font-size: 0.7rem; color: var(--text-dim); margin-top: 2px; }
    .appt-line { flex: 1; border-left: 2px solid var(--line); margin: 6px 0; }
    .appt-body { flex: 1; }
    .appt-service { font-size: 0.9rem; font-weight: 500; color: var(--cream); margin-bottom: 4px; }
    .appt-client { font-size: 0.8rem; color: var(--text-dim); }
    .appt-status { display: inline-block; font-size: 0.68rem; font-weight: 600; border-radius: 6px; padding: 2px 8px; margin-top: 6px; }
    .st-pending   { background: rgba(180,140,60,0.18); color: #c8a84b; }
    .st-confirmed { background: rgba(122,145,86,0.18); color: var(--olive-light); }
    .st-completed { background: rgba(255,255,255,0.07); color: var(--text-dim); }
    .st-cancelled { background: rgba(224,129,107,0.15); color: #e0816b; }
    .st-no_show   { background: rgba(224,129,107,0.15); color: #e0816b; }

    .empty-day { padding: 40px 16px; text-align: center; color: var(--text-dim); font-size: 0.9rem; }
    .loading-dots { display: flex; gap: 6px; justify-content: center; padding: 40px; }
    .loading-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--olive-light); animation: ld .9s infinite; }
    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes ld { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

    /* Logout btn */
    .logout-row { padding: 8px 16px 24px; }
    .btn-logout { background: none; border: 1px solid var(--line); border-radius: 10px; color: var(--text-dim); font-size: 0.8rem; padding: 8px 16px; cursor: pointer; }

    /* hidden */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="screenLogin" class="login-wrap">
  <div class="login-card">
    <img class="login-logo" src="/assets/img/logo.png" alt="Oliva" onerror="this.style.display='none'"/>
    <div class="login-title">Oliva</div>
    <div class="login-sub">Вхід для майстрів</div>
    <input type="password" id="pwdInput" placeholder="Пароль" autocomplete="current-password"/>
    <button onclick="doLogin()">Увійти</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- MASTER SELECT -->
<div id="screenMasters" class="hidden">
  <div class="master-select">
    <div class="page-title">Привіт 👋</div>
    <div class="page-sub">Вибери себе зі списку</div>
    <div class="master-list" id="masterList"></div>
  </div>
</div>

<!-- SCHEDULE -->
<div id="screenSchedule" class="hidden">
  <div class="schedule-wrap">
    <div class="sched-header">
      <button class="btn-back" onclick="goBack()">←</button>
      <div class="sched-master-info">
        <div id="schedAva"></div>
        <div>
          <div class="sched-name" id="schedName"></div>
          <div class="sched-level" id="schedLevel"></div>
        </div>
      </div>
    </div>
    <div class="days-tabs" id="daysTabs"></div>
    <div id="apptsWrap" class="appts-wrap"></div>
    <div class="logout-row">
      <button class="btn-logout" onclick="doLogout()">Вийти</button>
    </div>
  </div>
</div>

<script src="/assets/js/push.js"></script>
<script>
  var TOKEN_KEY = 'oliva_master_token';
  var MASTER_KEY = 'oliva_master_sel';
  var currentMaster = null;
  var currentDate = todayStr();

  function todayStr() {
    var d = new Date();
    return d.toISOString().slice(0,10);
  }

  function fmtMin(min) {
    var h = Math.floor(min/60), m = min%60;
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }

  function show(id) {
    ['screenLogin','screenMasters','screenSchedule'].forEach(function(s) {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  /* ── LOGIN ── */
  document.getElementById('pwdInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    var pwd = document.getElementById('pwdInput').value;
    document.getElementById('loginErr').textContent = '';
    fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pwd}),
      credentials: 'include'
    }).then(function(r){ return r.json(); }).then(function(j) {
      if (j.ok) {
        if (j.token) localStorage.setItem(TOKEN_KEY, j.token);
        initPush();
        loadMasters();
      } else {
        document.getElementById('loginErr').textContent = 'Невірний пароль';
      }
    }).catch(function() {
      document.getElementById('loginErr').textContent = 'Помилка зʼєднання';
    });
  }

  function authHeaders() {
    var t = localStorage.getItem(TOKEN_KEY);
    return t ? {'x-admin-token': t} : {};
  }

  /* ── PUSH ── */
  function initPush() {
    if (window.OlivaPush) window.OlivaPush.init({ headers: authHeaders() });
  }

  /* ── MASTERS ── */
  function loadMasters() {
    fetch('/api/masters').then(function(r){ return r.json(); }).then(function(j) {
      if (!j.ok) return;
      var list = document.getElementById('masterList');
      list.innerHTML = j.masters.map(function(m) {
        var ava = m.photo
          ? '<img class="master-ava" src="/api/master-img/'+m.photo+'" alt="'+m.name+'" onerror="this.style.display=\'none\'">'
          : '<div class="master-ava-ph">'+m.name.charAt(0)+'</div>';
        return '<div class="master-btn" onclick="selectMaster('+JSON.stringify(m)+')">'
          + ava
          + '<div class="master-info"><div class="master-name">'+m.name+'</div>'
          + '<div class="master-level">'+(m.level||'Майстер')+'</div></div>'
          + '<div class="master-arrow">›</div>'
          + '</div>';
      }).join('');
      show('screenMasters');
    });
  }

  function selectMaster(m) {
    currentMaster = m;
    localStorage.setItem(MASTER_KEY, JSON.stringify(m));
    renderScheduleHeader(m);
    buildDayTabs();
    loadAppts(currentDate);
    show('screenSchedule');
  }

  function renderScheduleHeader(m) {
    document.getElementById('schedName').textContent = m.name;
    document.getElementById('schedLevel').textContent = m.level || 'Майстер';
    var avaEl = document.getElementById('schedAva');
    if (m.photo) {
      avaEl.innerHTML = '<img class="sched-ava" src="/api/master-img/'+m.photo+'" alt="'+m.name+'">';
    } else {
      avaEl.innerHTML = '<div class="sched-ava-ph">'+m.name.charAt(0)+'</div>';
    }
  }

  /* ── DAYS TABS ── */
  var DOW_UK = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];

  function buildDayTabs() {
    var tabs = document.getElementById('daysTabs');
    var today = new Date();
    tabs.innerHTML = '';
    for (var i = 0; i < 14; i++) {
      var d = new Date(today);
      d.setDate(today.getDate() + i);
      var ds = d.toISOString().slice(0,10);
      var dow = DOW_UK[d.getDay()];
      var num = d.getDate();
      var tab = document.createElement('div');
      tab.className = 'day-tab' + (ds === currentDate ? ' active' : '');
      tab.dataset.date = ds;
      tab.innerHTML = '<div class="day-tab-dow">'+dow+'</div><div class="day-tab-num">'+num+'</div><div class="day-tab-dot hidden" id="dot-'+ds+'"></div>';
      tab.addEventListener('click', function() {
        document.querySelectorAll('.day-tab').forEach(function(t){ t.classList.remove('active'); });
        this.classList.add('active');
        currentDate = this.dataset.date;
        loadAppts(currentDate);
      });
      tabs.appendChild(tab);
    }
    // preload dots
    loadDots();
  }

  function loadDots() {
    if (!currentMaster) return;
    var today = new Date();
    var from = today.toISOString().slice(0,10);
    var end = new Date(today); end.setDate(today.getDate()+13);
    var to = end.toISOString().slice(0,10);
    fetch('/api/master/schedule?master_id='+currentMaster.id+'&from='+from+'&to='+to, {headers: authHeaders(), credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j) {
        if (!j.ok) return;
        var datesWithAppts = {};
        j.appointments.forEach(function(a) { datesWithAppts[a.date] = true; });
        Object.keys(datesWithAppts).forEach(function(d) {
          var dot = document.getElementById('dot-'+d);
          if (dot) dot.classList.remove('hidden');
        });
      }).catch(function(){});
  }

  /* ── APPOINTMENTS ── */
  var STATUS_LABELS = {
    pending: 'Очікує', confirmed: 'Підтверджено',
    completed: 'Виконано', cancelled: 'Скасовано', no_show: 'Не прийшов'
  };

  function loadAppts(date) {
    if (!currentMaster) return;
    var wrap = document.getElementById('apptsWrap');
    wrap.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
    fetch('/api/master/schedule?master_id='+currentMaster.id+'&date='+date, {headers: authHeaders(), credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j) {
        if (!j.ok) { wrap.innerHTML = '<div class="empty-day">Помилка завантаження</div>'; return; }
        var appts = j.appointments;
        if (!appts.length) {
          wrap.innerHTML = '<div class="empty-day">Записів на цей день немає 🌿</div>';
          return;
        }
        wrap.innerHTML = appts.map(function(a) {
          var stClass = 'st-'+(a.status||'pending');
          var stLabel = STATUS_LABELS[a.status] || a.status;
          return '<div class="appt-card">'
            + '<div class="appt-time-col">'
            + '<div class="appt-time">'+fmtMin(a.start_min)+'</div>'
            + '<div class="appt-dur">'+a.duration_min+' хв</div>'
            + '</div>'
            + '<div class="appt-body">'
            + '<div class="appt-service">'+(a.service_name||'—')+'</div>'
            + '<div class="appt-client">👤 '+(a.client_name||a.client_phone||'—')+'</div>'
            + '<span class="appt-status '+stClass+'">'+stLabel+'</span>'
            + '</div>'
            + '</div>';
        }).join('');
      }).catch(function() {
        wrap.innerHTML = '<div class="empty-day">Помилка зʼєднання</div>';
      });
  }

  /* ── NAV ── */
  function goBack() {
    show('screenMasters');
  }

  function doLogout() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(MASTER_KEY);
    currentMaster = null;
    fetch('/api/admin/logout', {method:'POST', credentials:'include'}).catch(function(){});
    show('screenLogin');
  }

  /* ── INIT ── */
  (function init() {
    var token = localStorage.getItem(TOKEN_KEY);
    if (!token) { show('screenLogin'); return; }
    // перевірити сесію
    fetch('/api/admin/me', {headers: authHeaders(), credentials:'include'})
      .then(function(r){ return r.json(); })
      .then(function(j) {
        if (!j.ok) { show('screenLogin'); return; }
        initPush();
        var saved = localStorage.getItem(MASTER_KEY);
        if (saved) {
          try { selectMaster(JSON.parse(saved)); return; } catch(e) {}
        }
        loadMasters();
      }).catch(function(){ show('screenLogin'); });
  })();

  /* ── SERVICE WORKER + PUSH ── */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
</script>
</body>
</html>
